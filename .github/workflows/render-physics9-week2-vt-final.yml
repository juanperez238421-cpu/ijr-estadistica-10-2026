name: Physics 9 Week 2 v-t Galileo FINAL PQH

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct approved source and exact JP dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p library tools delivery
          cp render_physics9_week2/physics9_week2_velocity_time_galileo.py physics9_week2_velocity_time_galileo.py
          python render_physics9_week2/apply_problem4_layout_v2.py
          echo '698854362b2e3376dec518156233a57f7b36330ab9382420d8e7fafa278de009  physics9_week2_velocity_time_galileo.py' | sha256sum -c -
          echo '4a5c21279f5c7ae1b4daffa3928bf1eb0dbdde6873ae688161c87e9987663a74  render_physics9_week2/style_exact.b64' | sha256sum -c -
          echo 'da1d43b8499b4613090d88689af8fadaa39a7280f65403e965aee8f96032a605  render_physics9_week2/checker_exact.b64' | sha256sum -c -
          base64 -d render_physics9_week2/style_exact.b64 | gzip -d > library/jp_classroom_style.py
          base64 -d render_physics9_week2/checker_exact.b64 | gzip -d > tools/check_manim_style.py
          touch library/__init__.py
          echo '3f3f06e94d5cad870ad335502cc1a93e56ce675abb1231ded5f9c71fd3e60e3d  library/jp_classroom_style.py' | sha256sum -c -
          echo 'd2f6c4ceaf8ff41dcf2312aaf54b1b92a4211985d67c97fa749cd56123ffdbd9  tools/check_manim_style.py' | sha256sum -c -
          cp physics9_week2_velocity_time_galileo.py delivery/Physics9_Week2_VelocityTime_Galileo_FINAL.py

      - name: Static and style validation
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile physics9_week2_velocity_time_galileo.py
          python tools/check_manim_style.py physics9_week2_velocity_time_galileo.py | tee delivery/STYLE_QA.txt
          grep -q 'PASS: no structural/style issues detected.' delivery/STYLE_QA.txt
          grep -q 'class Physics9Week2VelocityTimeTheory' physics9_week2_velocity_time_galileo.py
          grep -q 'class Physics9Week2VelocityTimeProblems' physics9_week2_velocity_time_galileo.py

      - name: Prepare official ManimCE 0.20.1
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          docker pull manimcommunity/manim:v0.20.1

      - name: Numerical lesson assertions
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/manim-home -v "$PWD:/manim" -w /manim --entrypoint bash manimcommunity/manim:v0.20.1 -c 'python physics9_week2_velocity_time_galileo.py' | tee delivery/ASSERTIONS.txt
          grep -q 'Physics 9 Week 2 velocity-time lesson assertions passed.' delivery/ASSERTIONS.txt

      - name: Full literal pql protocol renders
        shell: bash
        run: |
          set -euo pipefail
          for S in Physics9Week2VelocityTimeTheory Physics9Week2VelocityTimeProblems; do
            docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=0.10 -v "$PWD:/manim" -w /manim --entrypoint bash manimcommunity/manim:v0.20.1 -c "
              set -euo pipefail
              mkdir -p /tmp/manim-home /tmp/manim-bin
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=\"/tmp/manim-bin:\$PATH\"
              manim -pql --fps 15 -r 854,480 physics9_week2_velocity_time_galileo.py $S --format=mp4 --disable_caching --media_dir media_preview_$S
            "
            V=$(find "media_preview_$S" -type f -name "$S.mp4" -print -quit)
            test -n "$V" && test -s "$V"
            cp "$V" "delivery/${S}_PREVIEW_pql.mp4"
            ffmpeg -v error -i "delivery/${S}_PREVIEW_pql.mp4" -f null -
          done

      - name: Final literal pqh renders
        shell: bash
        run: |
          set -euo pipefail
          for S in Physics9Week2VelocityTimeTheory Physics9Week2VelocityTimeProblems; do
            docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=1.00 -v "$PWD:/manim" -w /manim --entrypoint bash manimcommunity/manim:v0.20.1 -c "
              set -euo pipefail
              mkdir -p /tmp/manim-home /tmp/manim-bin
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=\"/tmp/manim-bin:\$PATH\"
              manim -pqh --fps 30 -r 1920,1080 physics9_week2_velocity_time_galileo.py $S --format=mp4 --disable_caching --media_dir media_final_$S
            "
            V=$(find "media_final_$S" -type f -name "$S.mp4" -print -quit)
            test -n "$V" && test -s "$V"
            if [ "$S" = 'Physics9Week2VelocityTimeTheory' ]; then
              OUT='delivery/Physics9_Week2_VelocityTime_Galileo_THEORY_FINAL_PQH.mp4'
            else
              OUT='delivery/Physics9_Week2_VelocityTime_WORKED_PROBLEMS_FINAL_PQH.mp4'
            fi
            cp "$V" "$OUT"
          done

      - name: Technical verification of both final MP4s
        shell: bash
        run: |
          set -euo pipefail
          : > delivery/FFPROBE.txt
          for V in delivery/Physics9_Week2_VelocityTime_Galileo_THEORY_FINAL_PQH.mp4 delivery/Physics9_Week2_VelocityTime_WORKED_PROBLEMS_FINAL_PQH.mp4; do
            echo "===== $(basename "$V") =====" | tee -a delivery/FFPROBE.txt
            ffprobe -v error -show_entries stream=codec_name,profile,width,height,pix_fmt,r_frame_rate,avg_frame_rate,nb_frames:format=duration,size -of default=noprint_wrappers=1 "$V" | tee -a delivery/FFPROBE.txt
            ffprobe -v error -show_entries stream=codec_name,width,height,pix_fmt,r_frame_rate -of csv=p=0 "$V" | grep -q 'h264,1920,1080,yuv420p,30/1'
            ffmpeg -v error -i "$V" -f null -
          done
          echo 'PASS: both full PQH MP4s decoded completely without FFmpeg errors.' | tee delivery/TECHNICAL_VERIFICATION.txt

      - name: Dense final visual QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delivery/qa_theory delivery/qa_problems delivery/qa_targeted
          python - <<'PY'
          import subprocess, os
          specs=[
              ('delivery/Physics9_Week2_VelocityTime_Galileo_THEORY_FINAL_PQH.mp4',120,'delivery/qa_theory'),
              ('delivery/Physics9_Week2_VelocityTime_WORKED_PROBLEMS_FINAL_PQH.mp4',96,'delivery/qa_problems'),
          ]
          for v,n,out in specs:
              d=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','csv=p=0',v],text=True))
              for i in range(n):
                  t=max(0,min(d-.05,d*(i+.5)/n))
                  subprocess.run(['ffmpeg','-y','-v','error','-ss',f'{t:.3f}','-i',v,'-frames:v','1',f'{out}/frame_{i+1:03d}.png'],check=True)
          # Extra dense samples around Galileo theory scene (~10–25% of theory timeline)
          v='delivery/Physics9_Week2_VelocityTime_Galileo_THEORY_FINAL_PQH.mp4'
          d=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','csv=p=0',v],text=True))
          for i in range(28):
              f=.09 + (.18)*(i+.5)/28
              t=d*f
              subprocess.run(['ffmpeg','-y','-v','error','-ss',f'{t:.3f}','-i',v,'-frames:v','1',f'delivery/qa_targeted/galileo_{i+1:02d}.png'],check=True)
          # Extra dense samples around Problem 4 (~48–72% of problems timeline)
          v='delivery/Physics9_Week2_VelocityTime_WORKED_PROBLEMS_FINAL_PQH.mp4'
          d=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','csv=p=0',v],text=True))
          for i in range(32):
              f=.48 + (.24)*(i+.5)/32
              t=d*f
              subprocess.run(['ffmpeg','-y','-v','error','-ss',f'{t:.3f}','-i',v,'-frames:v','1',f'delivery/qa_targeted/problem4_{i+1:02d}.png'],check=True)
          PY
          ffmpeg -y -v error -pattern_type glob -i 'delivery/qa_theory/frame_*.png' -vf 'scale=300:-1,tile=10x12:padding=4:margin=4:color=white' -frames:v 1 delivery/THEORY_120_FRAME_FINAL_QA.png
          ffmpeg -y -v error -pattern_type glob -i 'delivery/qa_problems/frame_*.png' -vf 'scale=320:-1,tile=12x8:padding=4:margin=4:color=white' -frames:v 1 delivery/PROBLEMS_96_FRAME_FINAL_QA.png
          ffmpeg -y -v error -pattern_type glob -i 'delivery/qa_targeted/galileo_*.png' -vf 'scale=480:-1,tile=7x4:padding=6:margin=6:color=white' -frames:v 1 delivery/GALILEO_28_FRAME_TARGETED_QA.png
          ffmpeg -y -v error -pattern_type glob -i 'delivery/qa_targeted/problem4_*.png' -vf 'scale=420:-1,tile=8x4:padding=6:margin=6:color=white' -frames:v 1 delivery/PROBLEM4_32_FRAME_TARGETED_QA.png

      - name: Report and hashes
        shell: bash
        run: |
          set -euo pipefail
          cat > delivery/RENDER_INFO.txt <<'EOF'
          Physics 9 — Week 2: Velocity–Time Graphs + Galileo Inclined-Plane Bridge
          Two final videos:
          A) Theory: v–t sign, rest, constant velocity, signed area as displacement, Galileo schematic bridge.
          B) Worked problems: graph reading, displacement/distance by area, story→v–t, x–t→v–t, Galileo interpretation.
          Approved source SHA-256: 698854362b2e3376dec518156233a57f7b36330ab9382420d8e7fafa278de009
          Renderer: official manimcommunity/manim:v0.20.1
          Protocol preview: literal -pql, 854x480, 15 fps, LESSON_TIME_SCALE=0.10
          Final: literal -pqh, 1920x1080, 30 fps, LESSON_TIME_SCALE=1.00
          Historical framing: Galileo ramp numerical positions are explicitly schematic and are not represented as Galileo's exact historical measurements.
          QA: 120 theory frames + 96 problems frames + 28 targeted Galileo frames + 32 targeted Problem 4 frames.
          EOF
          sha256sum delivery/Physics9_Week2_VelocityTime_Galileo_THEORY_FINAL_PQH.mp4 delivery/Physics9_Week2_VelocityTime_WORKED_PROBLEMS_FINAL_PQH.mp4 delivery/Physics9_Week2_VelocityTime_Galileo_FINAL.py delivery/THEORY_120_FRAME_FINAL_QA.png delivery/PROBLEMS_96_FRAME_FINAL_QA.png delivery/GALILEO_28_FRAME_TARGETED_QA.png delivery/PROBLEM4_32_FRAME_TARGETED_QA.png > delivery/SHA256SUMS.txt

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: Physics9-Week2-VelocityTime-Galileo-FINAL-PQH
          path: delivery/
          if-no-files-found: error
          retention-days: 7
