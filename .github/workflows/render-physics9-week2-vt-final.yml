name: Physics 9 Week 2 CINEMATIC V2 Preview QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct cinematic V2 source and exact JP dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p library tools delivery
          echo 'b90db463038792d1b2656e4192834d2b94895dbf4dc0bace63b30b79825cdbbb  render_physics9_week2_v2/source_v2.xz.b64' | sha256sum -c -
          base64 -d render_physics9_week2_v2/source_v2.xz.b64 | xz -d > physics9_week2_velocity_time_galileo_cinematic_v2.py
          echo '9ddbbb45d7cf69d5a7f87287a7c1051c6df68eea587a9cb3bfe1c4e855022530  physics9_week2_velocity_time_galileo_cinematic_v2.py' | sha256sum -c -
          echo '4a5c21279f5c7ae1b4daffa3928bf1eb0dbdde6873ae688161c87e9987663a74  render_physics9_week2/style_exact.b64' | sha256sum -c -
          echo 'da1d43b8499b4613090d88689af8fadaa39a7280f65403e965aee8f96032a605  render_physics9_week2/checker_exact.b64' | sha256sum -c -
          base64 -d render_physics9_week2/style_exact.b64 | gzip -d > library/jp_classroom_style.py
          base64 -d render_physics9_week2/checker_exact.b64 | gzip -d > tools/check_manim_style.py
          touch library/__init__.py
          echo '3f3f06e94d5cad870ad335502cc1a93e56ce675abb1231ded5f9c71fd3e60e3d  library/jp_classroom_style.py' | sha256sum -c -
          echo 'd2f6c4ceaf8ff41dcf2312aaf54b1b92a4211985d67c97fa749cd56123ffdbd9  tools/check_manim_style.py' | sha256sum -c -
          cp physics9_week2_velocity_time_galileo_cinematic_v2.py delivery/Physics9_Week2_VelocityTime_Galileo_CINEMATIC_V2.py

      - name: Static and style validation
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile physics9_week2_velocity_time_galileo_cinematic_v2.py
          python tools/check_manim_style.py physics9_week2_velocity_time_galileo_cinematic_v2.py | tee delivery/STYLE_QA.txt
          grep -q 'PASS: no structural/style issues detected.' delivery/STYLE_QA.txt

      - name: Prepare official ManimCE 0.20.1
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg xz-utils
          docker pull manimcommunity/manim:v0.20.1

      - name: Numerical lesson assertions
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/manim-home -v "$PWD:/manim" -w /manim --entrypoint bash manimcommunity/manim:v0.20.1 -c 'python physics9_week2_velocity_time_galileo_cinematic_v2.py' | tee delivery/ASSERTIONS.txt
          grep -q 'Physics 9 Week 2 velocity-time lesson assertions passed.' delivery/ASSERTIONS.txt

      - name: Full literal pql previews
        shell: bash
        run: |
          set -euo pipefail
          for S in Physics9Week2VelocityTimeTheory Physics9Week2VelocityTimeProblems; do
            docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=0.10 -v "$PWD:/manim" -w /manim --entrypoint bash manimcommunity/manim:v0.20.1 -c "
              set -euo pipefail
              mkdir -p /tmp/manim-home /tmp/manim-bin
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=\"/tmp/manim-bin:\$PATH\"
              manim -pql --fps 15 -r 854,480 physics9_week2_velocity_time_galileo_cinematic_v2.py $S --format=mp4 --disable_caching --media_dir media_$S
            "
            V=$(find "media_$S" -type f -name "$S.mp4" -print -quit)
            test -n "$V" && test -s "$V"
            cp "$V" "delivery/${S}_CINEMATIC_V2_PREVIEW_pql.mp4"
            ffmpeg -v error -i "delivery/${S}_CINEMATIC_V2_PREVIEW_pql.mp4" -f null -
          done

      - name: Dense temporal QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delivery/qa_theory delivery/qa_problems delivery/qa_galileo delivery/qa_area delivery/qa_problem4
          python - <<'PY'
          import subprocess, os
          specs=[
              ('Physics9Week2VelocityTimeTheory',100,'delivery/qa_theory'),
              ('Physics9Week2VelocityTimeProblems',84,'delivery/qa_problems'),
          ]
          for scene,n,out in specs:
              v=f'delivery/{scene}_CINEMATIC_V2_PREVIEW_pql.mp4'
              d=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','csv=p=0',v],text=True))
              for i in range(n):
                  t=max(0,min(d-.03,d*(i+.5)/n))
                  subprocess.run(['ffmpeg','-y','-v','error','-ss',f'{t:.3f}','-i',v,'-frames:v','1',f'{out}/frame_{i+1:03d}.png'],check=True)
          targets=[
              ('Physics9Week2VelocityTimeTheory',.10,.28,36,'delivery/qa_galileo','galileo'),
              ('Physics9Week2VelocityTimeTheory',.62,.90,40,'delivery/qa_area','area'),
              ('Physics9Week2VelocityTimeProblems',.48,.76,40,'delivery/qa_problem4','problem4'),
          ]
          for scene,a,b,n,out,prefix in targets:
              v=f'delivery/{scene}_CINEMATIC_V2_PREVIEW_pql.mp4'
              d=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','csv=p=0',v],text=True))
              for i in range(n):
                  t=d*(a+(b-a)*(i+.5)/n)
                  subprocess.run(['ffmpeg','-y','-v','error','-ss',f'{t:.3f}','-i',v,'-frames:v','1',f'{out}/{prefix}_{i+1:03d}.png'],check=True)
          PY
          ffmpeg -y -v error -pattern_type glob -i 'delivery/qa_theory/frame_*.png' -vf 'scale=300:-1,tile=10x10:padding=4:margin=4:color=white' -frames:v 1 delivery/THEORY_100_FRAME_V2_QA.png
          ffmpeg -y -v error -pattern_type glob -i 'delivery/qa_problems/frame_*.png' -vf 'scale=330:-1,tile=12x7:padding=4:margin=4:color=white' -frames:v 1 delivery/PROBLEMS_84_FRAME_V2_QA.png
          ffmpeg -y -v error -pattern_type glob -i 'delivery/qa_galileo/galileo_*.png' -vf 'scale=500:-1,tile=6x6:padding=6:margin=6:color=white' -frames:v 1 delivery/GALILEO_36_FRAME_V2_QA.png
          ffmpeg -y -v error -pattern_type glob -i 'delivery/qa_area/area_*.png' -vf 'scale=460:-1,tile=8x5:padding=6:margin=6:color=white' -frames:v 1 delivery/AREA_40_FRAME_V2_QA.png
          ffmpeg -y -v error -pattern_type glob -i 'delivery/qa_problem4/problem4_*.png' -vf 'scale=460:-1,tile=8x5:padding=6:margin=6:color=white' -frames:v 1 delivery/PROBLEM4_40_FRAME_V2_QA.png
          sha256sum delivery/*.mp4 delivery/*_QA.png > delivery/PREVIEW_SHA256.txt

      - name: Upload cinematic preview QA
        uses: actions/upload-artifact@v4
        with:
          name: Physics9-Week2-CINEMATIC-V2-PREVIEW-QA
          path: delivery/
          if-no-files-found: error
          retention-days: 7
