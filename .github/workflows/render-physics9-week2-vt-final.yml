name: Physics 9 Week 2 CINEMATIC V2 FINAL PQH

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct approved cinematic V2 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p library tools delivery
          echo '9e0fa908b958629c911290427da17ed887c641721fc0cde01b0548866a85d571  render_physics9_week2_v2/source_v2_fixed.xz.b64' | sha256sum -c -
          base64 -d render_physics9_week2_v2/source_v2_fixed.xz.b64 | xz -d > physics9_week2_velocity_time_galileo_cinematic_v2.py
          echo 'bc2f3bbeeebfc471cb2c498fdd0c0d0927503a6030de042fce353b35618a7aac  physics9_week2_velocity_time_galileo_cinematic_v2.py' | sha256sum -c -
          base64 -d render_physics9_week2/style_exact.b64 | gzip -d > library/jp_classroom_style.py
          base64 -d render_physics9_week2/checker_exact.b64 | gzip -d > tools/check_manim_style.py
          touch library/__init__.py
          echo '3f3f06e94d5cad870ad335502cc1a93e56ce675abb1231ded5f9c71fd3e60e3d  library/jp_classroom_style.py' | sha256sum -c -
          echo 'd2f6c4ceaf8ff41dcf2312aaf54b1b92a4211985d67c97fa749cd56123ffdbd9  tools/check_manim_style.py' | sha256sum -c -
          cp physics9_week2_velocity_time_galileo_cinematic_v2.py delivery/Physics9_Week2_VelocityTime_Galileo_CINEMATIC_V2.py

      - name: Static source validation
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile physics9_week2_velocity_time_galileo_cinematic_v2.py
          python tools/check_manim_style.py physics9_week2_velocity_time_galileo_cinematic_v2.py | tee delivery/STYLE_QA.txt
          grep -q 'PASS: no structural/style issues detected.' delivery/STYLE_QA.txt

      - name: Prepare official ManimCE 0.20.1
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg xz-utils
          docker pull manimcommunity/manim:v0.20.1

      - name: Numerical assertions
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/manim-home -v "$PWD:/manim" -w /manim --entrypoint bash manimcommunity/manim:v0.20.1 -c 'python physics9_week2_velocity_time_galileo_cinematic_v2.py' | tee delivery/ASSERTIONS.txt
          grep -q 'Physics 9 Week 2 velocity-time lesson assertions passed.' delivery/ASSERTIONS.txt

      - name: Complete literal pql protocol renders
        shell: bash
        run: |
          set -euo pipefail
          for S in Physics9Week2VelocityTimeTheory Physics9Week2VelocityTimeProblems; do
            docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=0.10 -v "$PWD:/manim" -w /manim --entrypoint bash manimcommunity/manim:v0.20.1 -c "
              set -euo pipefail
              mkdir -p /tmp/manim-home /tmp/manim-bin
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=\"/tmp/manim-bin:\$PATH\"
              manim -pql --fps 15 -r 854,480 physics9_week2_velocity_time_galileo_cinematic_v2.py $S --format=mp4 --disable_caching --media_dir media_pql_$S
            "
            V=$(find "media_pql_$S" -type f -name "$S.mp4" -print -quit)
            test -n "$V" && test -s "$V"
            cp "$V" "delivery/${S}_CINEMATIC_V2_PREVIEW_pql.mp4"
            ffmpeg -v error -i "delivery/${S}_CINEMATIC_V2_PREVIEW_pql.mp4" -f null -
          done

      - name: Final literal pqh renders
        shell: bash
        run: |
          set -euo pipefail
          for S in Physics9Week2VelocityTimeTheory Physics9Week2VelocityTimeProblems; do
            docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=1.00 -v "$PWD:/manim" -w /manim --entrypoint bash manimcommunity/manim:v0.20.1 -c "
              set -euo pipefail
              mkdir -p /tmp/manim-home /tmp/manim-bin
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=\"/tmp/manim-bin:\$PATH\"
              manim -pqh --fps 30 -r 1920,1080 physics9_week2_velocity_time_galileo_cinematic_v2.py $S --format=mp4 --disable_caching --media_dir media_pqh_$S
            "
            V=$(find "media_pqh_$S" -type f -name "$S.mp4" -print -quit)
            test -n "$V" && test -s "$V"
            if [ "$S" = Physics9Week2VelocityTimeTheory ]; then OUT=Physics9_Week2_VelocityTime_Galileo_CINEMATIC_V2_THEORY_FINAL_PQH.mp4; else OUT=Physics9_Week2_VelocityTime_CINEMATIC_V2_WORKED_PROBLEMS_FINAL_PQH.mp4; fi
            cp "$V" "delivery/$OUT"
          done

      - name: Technical verification
        shell: bash
        run: |
          set -euo pipefail
          : > delivery/FFPROBE.txt
          : > delivery/TECHNICAL_VERIFICATION.txt
          for V in delivery/Physics9_Week2_VelocityTime_Galileo_CINEMATIC_V2_THEORY_FINAL_PQH.mp4 delivery/Physics9_Week2_VelocityTime_CINEMATIC_V2_WORKED_PROBLEMS_FINAL_PQH.mp4; do
            echo "===== $(basename "$V") =====" | tee -a delivery/FFPROBE.txt
            ffprobe -v error -show_entries stream=codec_name,profile,width,height,pix_fmt,r_frame_rate,avg_frame_rate,nb_frames:format=duration,size -of default=noprint_wrappers=1 "$V" | tee -a delivery/FFPROBE.txt
            ffmpeg -v error -i "$V" -f null -
            echo "PASS full decode: $(basename "$V")" | tee -a delivery/TECHNICAL_VERIFICATION.txt
          done
          test "$(grep -c 'width=1920' delivery/FFPROBE.txt)" -eq 2
          test "$(grep -c 'height=1080' delivery/FFPROBE.txt)" -eq 2
          test "$(grep -c 'pix_fmt=yuv420p' delivery/FFPROBE.txt)" -eq 2

      - name: Dense full-HD visual QA
        shell: bash
        run: |
          set -euo pipefail
          TV=delivery/Physics9_Week2_VelocityTime_Galileo_CINEMATIC_V2_THEORY_FINAL_PQH.mp4
          PV=delivery/Physics9_Week2_VelocityTime_CINEMATIC_V2_WORKED_PROBLEMS_FINAL_PQH.mp4
          mkdir -p delivery/qa_theory delivery/qa_problems delivery/qa_galileo delivery/qa_area delivery/qa_problem4
          python - <<'PY'
          import subprocess, os
          specs=[
            ('delivery/Physics9_Week2_VelocityTime_Galileo_CINEMATIC_V2_THEORY_FINAL_PQH.mp4',120,'delivery/qa_theory','theory'),
            ('delivery/Physics9_Week2_VelocityTime_CINEMATIC_V2_WORKED_PROBLEMS_FINAL_PQH.mp4',100,'delivery/qa_problems','problems'),
          ]
          for v,n,out,prefix in specs:
              d=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','csv=p=0',v],text=True))
              for i in range(n):
                  t=max(0,min(d-.05,d*(i+.5)/n))
                  subprocess.run(['ffmpeg','-y','-v','error','-ss',f'{t:.3f}','-i',v,'-frames:v','1',f'{out}/{prefix}_{i+1:03d}.png'],check=True)
          targets=[
            ('delivery/Physics9_Week2_VelocityTime_Galileo_CINEMATIC_V2_THEORY_FINAL_PQH.mp4',.10,.28,40,'delivery/qa_galileo','galileo'),
            ('delivery/Physics9_Week2_VelocityTime_Galileo_CINEMATIC_V2_THEORY_FINAL_PQH.mp4',.62,.90,48,'delivery/qa_area','area'),
            ('delivery/Physics9_Week2_VelocityTime_CINEMATIC_V2_WORKED_PROBLEMS_FINAL_PQH.mp4',.48,.76,48,'delivery/qa_problem4','problem4'),
          ]
          for v,a,b,n,out,prefix in targets:
              d=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','csv=p=0',v],text=True))
              for i in range(n):
                  t=d*(a+(b-a)*(i+.5)/n)
                  subprocess.run(['ffmpeg','-y','-v','error','-ss',f'{t:.3f}','-i',v,'-frames:v','1',f'{out}/{prefix}_{i+1:03d}.png'],check=True)
          PY
          ffmpeg -y -v error -pattern_type glob -i 'delivery/qa_theory/theory_*.png' -vf 'scale=300:-1,tile=12x10:padding=4:margin=4:color=white' -frames:v 1 delivery/THEORY_120_FRAME_FINAL_QA.png
          ffmpeg -y -v error -pattern_type glob -i 'delivery/qa_problems/problems_*.png' -vf 'scale=330:-1,tile=10x10:padding=4:margin=4:color=white' -frames:v 1 delivery/PROBLEMS_100_FRAME_FINAL_QA.png
          ffmpeg -y -v error -pattern_type glob -i 'delivery/qa_galileo/galileo_*.png' -vf 'scale=500:-1,tile=8x5:padding=6:margin=6:color=white' -frames:v 1 delivery/GALILEO_40_FRAME_FINAL_QA.png
          ffmpeg -y -v error -pattern_type glob -i 'delivery/qa_area/area_*.png' -vf 'scale=460:-1,tile=8x6:padding=6:margin=6:color=white' -frames:v 1 delivery/AREA_48_FRAME_FINAL_QA.png
          ffmpeg -y -v error -pattern_type glob -i 'delivery/qa_problem4/problem4_*.png' -vf 'scale=460:-1,tile=8x6:padding=6:margin=6:color=white' -frames:v 1 delivery/PROBLEM4_48_FRAME_FINAL_QA.png

      - name: Report and hashes
        shell: bash
        run: |
          set -euo pipefail
          cat > delivery/RENDER_INFO.txt <<'EOF'
          Physics 9 Week 2 — Velocity-Time + Galileo CINEMATIC V2
          Source SHA-256: bc2f3bbeeebfc471cb2c498fdd0c0d0927503a6030de042fce353b35618a7aac
          Renderer: manimcommunity/manim:v0.20.1
          Full previews: literal -pql, 854x480, 15 fps, LESSON_TIME_SCALE=0.10
          Finals: literal -pqh, 1920x1080, 30 fps, LESSON_TIME_SCALE=1.00
          Cinematic changes: linked x-t/v-t tracers; Galileo equal-time clock and moving ball; synchronized cart/graph motion; dynamically growing signed area; running displacement accumulator; story/sign/graph mappings; x-t segment -> slope -> v-t level transformations.
          EOF
          sha256sum delivery/Physics9_Week2_VelocityTime_Galileo_CINEMATIC_V2_THEORY_FINAL_PQH.mp4 delivery/Physics9_Week2_VelocityTime_CINEMATIC_V2_WORKED_PROBLEMS_FINAL_PQH.mp4 delivery/Physics9_Week2_VelocityTime_Galileo_CINEMATIC_V2.py delivery/THEORY_120_FRAME_FINAL_QA.png delivery/PROBLEMS_100_FRAME_FINAL_QA.png > delivery/SHA256SUMS.txt

      - name: Upload final cinematic package
        uses: actions/upload-artifact@v4
        with:
          name: Physics9-Week2-CINEMATIC-V2-FINAL-PQH
          path: delivery/
          if-no-files-found: error
          retention-days: 7
