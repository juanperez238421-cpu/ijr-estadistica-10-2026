name: Physics 9 Week 2 v-t Galileo Preview QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare source and JP dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p library tools delivery
          cp render_physics9_week2/physics9_week2_velocity_time_galileo.py physics9_week2_velocity_time_galileo.py
          base64 -d render_motion_exact_20260810/style_exact.b64 | gzip -d > library/jp_classroom_style.py
          base64 -d render_motion_exact_20260810/checker_exact.b64 | gzip -d > tools/check_manim_style.py
          touch library/__init__.py
          sha256sum physics9_week2_velocity_time_galileo.py library/jp_classroom_style.py tools/check_manim_style.py | tee delivery/SOURCE_SHA256.txt

      - name: Static and style QA
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile physics9_week2_velocity_time_galileo.py
          python tools/check_manim_style.py physics9_week2_velocity_time_galileo.py | tee delivery/STYLE_QA.txt
          grep -q 'PASS: no structural/style issues detected.' delivery/STYLE_QA.txt

      - name: Prepare ManimCE 0.20.1
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          docker pull manimcommunity/manim:v0.20.1

      - name: Numerical assertions
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/manim-home -v "$PWD:/manim" -w /manim --entrypoint bash manimcommunity/manim:v0.20.1 -c 'python physics9_week2_velocity_time_galileo.py' | tee delivery/ASSERTIONS.txt
          grep -q 'Physics 9 Week 2 velocity-time lesson assertions passed.' delivery/ASSERTIONS.txt

      - name: Full literal pql previews
        shell: bash
        run: |
          set -euo pipefail
          for S in Physics9Week2VelocityTimeTheory Physics9Week2VelocityTimeProblems; do
            docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=0.10 -v "$PWD:/manim" -w /manim --entrypoint bash manimcommunity/manim:v0.20.1 -c "
              set -euo pipefail
              mkdir -p /tmp/manim-home /tmp/manim-bin
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=\"/tmp/manim-bin:\$PATH\"
              manim -pql --fps 15 -r 854,480 physics9_week2_velocity_time_galileo.py $S --format=mp4 --disable_caching --media_dir media_$S
            "
            V=$(find "media_$S" -type f -name "$S.mp4" -print -quit)
            test -n "$V" && test -s "$V"
            cp "$V" "delivery/${S}_PREVIEW_pql.mp4"
            ffmpeg -v error -i "delivery/${S}_PREVIEW_pql.mp4" -f null -
          done

      - name: Dense temporal QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delivery/qa_theory delivery/qa_problems
          python - <<'PY'
          import subprocess, os
          specs=[('Physics9Week2VelocityTimeTheory',80,'delivery/qa_theory'),('Physics9Week2VelocityTimeProblems',64,'delivery/qa_problems')]
          for scene,n,out in specs:
              v=f'delivery/{scene}_PREVIEW_pql.mp4'
              d=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','csv=p=0',v],text=True))
              for i in range(n):
                  t=max(0,min(d-.03,d*(i+.5)/n))
                  subprocess.run(['ffmpeg','-y','-v','error','-ss',f'{t:.3f}','-i',v,'-frames:v','1',f'{out}/frame_{i+1:03d}.png'],check=True)
          PY
          ffmpeg -y -v error -pattern_type glob -i 'delivery/qa_theory/frame_*.png' -vf 'scale=320:-1,tile=8x10:padding=5:margin=5:color=white' -frames:v 1 delivery/THEORY_80_FRAME_QA.png
          ffmpeg -y -v error -pattern_type glob -i 'delivery/qa_problems/frame_*.png' -vf 'scale=360:-1,tile=8x8:padding=5:margin=5:color=white' -frames:v 1 delivery/PROBLEMS_64_FRAME_QA.png
          sha256sum delivery/Physics9Week2VelocityTimeTheory_PREVIEW_pql.mp4 delivery/Physics9Week2VelocityTimeProblems_PREVIEW_pql.mp4 delivery/THEORY_80_FRAME_QA.png delivery/PROBLEMS_64_FRAME_QA.png > delivery/PREVIEW_SHA256.txt

      - name: Upload preview QA
        uses: actions/upload-artifact@v4
        with:
          name: Physics9-Week2-vt-Galileo-PREVIEW-QA
          path: delivery/
          if-no-files-found: error
          retention-days: 7
