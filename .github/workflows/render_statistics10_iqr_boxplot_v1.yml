name: Render Statistics 10 IQR Box Plot V1 PQH

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore exact reviewed source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delivery
          echo "456d96fb0629c190b3f044012d2b5904622f75ae12da38c353c5861899a93ead  source_chunks_iqr_v1/part_00" | sha256sum -c -
          echo "b113975abf25200470fa7b043dae7a08c0b57d9d8c4c47dee2c25216c3ce1b43  source_chunks_iqr_v1/part_01" | sha256sum -c -
          echo "87b7b979ce957d0ba39753e41cc0ea870f8978151bc496a8ef400a7802d07e2f  source_chunks_iqr_v1/part_02" | sha256sum -c -
          echo "7136361ee06207fde165986912ce1213053ff4ceb2654c7a274369ac7e7f7a6e  source_chunks_iqr_v1/part_03" | sha256sum -c -
          cat source_chunks_iqr_v1/part_00 \
              source_chunks_iqr_v1/part_01 \
              source_chunks_iqr_v1/part_02 \
              source_chunks_iqr_v1/part_03 \
              > source.gz.b64
          test "$(wc -c < source.gz.b64)" -eq 15188
          base64 -d source.gz.b64 | gzip -d > statistics10_iqr_boxplot_construction_masterclass.py
          test -s statistics10_iqr_boxplot_construction_masterclass.py
          echo "81a6a9645ce6ed54876e93183daa1ea81800ba30ad9d23b04d3201c2c9d38627  statistics10_iqr_boxplot_construction_masterclass.py" | sha256sum -c -
          cp statistics10_iqr_boxplot_construction_masterclass.py delivery/

      - name: Validate source and lesson structure
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile statistics10_iqr_boxplot_construction_masterclass.py
          grep -q '^class Statistics10IQRBoxPlotConstruction' statistics10_iqr_boxplot_construction_masterclass.py
          grep -q 'Q1 = float(median(LOWER_HALF))' statistics10_iqr_boxplot_construction_masterclass.py
          grep -q 'UPPER_FENCE = Q3 + 1.5 \* IQR' statistics10_iqr_boxplot_construction_masterclass.py
          grep -q 'def construct_modified_box_plot' statistics10_iqr_boxplot_construction_masterclass.py
          python - <<'PY'
          from pathlib import Path
          source = Path('statistics10_iqr_boxplot_construction_masterclass.py').read_text()
          assert not [(i, ord(c)) for i, c in enumerate(source) if ord(c) < 32 and c not in '\n\t']
          for token in (r'\frac', r'\text', 'LOWER_FENCE', 'UPPER_FENCE', 'OUTLIERS'):
              assert token in source
          print('Static source audit passed.')
          PY

      - name: Prepare render environment
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          docker pull manimcommunity/manim:v0.20.1

      - name: Run statistical assertions
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -v "$PWD:/manim" -w /manim \
            --entrypoint bash manimcommunity/manim:v0.20.1 \
            -c 'set -euo pipefail; python statistics10_iqr_boxplot_construction_masterclass.py' \
            | tee delivery/MATHEMATICAL_ASSERTIONS.txt
          grep -q 'IQR lesson assertions passed' delivery/MATHEMATICAL_ASSERTIONS.txt

      - name: Render complete literal pql preview
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=0.10 \
            -v "$PWD:/manim" -w /manim --entrypoint bash \
            manimcommunity/manim:v0.20.1 -c '
              set -euo pipefail
              mkdir -p /tmp/manim-home /tmp/manim-bin delivery
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH="/tmp/manim-bin:$PATH"
              manim -pql --fps 15 -r 854,480 \
                statistics10_iqr_boxplot_construction_masterclass.py \
                Statistics10IQRBoxPlotConstruction \
                --format=mp4 --disable_caching --media_dir media_preview
              VIDEO=$(find media_preview -type f -name Statistics10IQRBoxPlotConstruction.mp4 -print -quit)
              test -n "$VIDEO" && test -s "$VIDEO"
              cp "$VIDEO" delivery/Statistics10_IQR_BoxPlot_Construction_pql.mp4
            '
          ffmpeg -v error -i delivery/Statistics10_IQR_BoxPlot_Construction_pql.mp4 -f null -
          ffprobe -v error \
            -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            delivery/Statistics10_IQR_BoxPlot_Construction_pql.mp4 \
            | tee delivery/PQL_FFPROBE.txt

      - name: Render final literal pqh video
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=1.00 \
            -v "$PWD:/manim" -w /manim --entrypoint bash \
            manimcommunity/manim:v0.20.1 -c '
              set -euo pipefail
              mkdir -p /tmp/manim-home /tmp/manim-bin delivery
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH="/tmp/manim-bin:$PATH"
              manim -pqh --fps 30 -r 1920,1080 \
                statistics10_iqr_boxplot_construction_masterclass.py \
                Statistics10IQRBoxPlotConstruction \
                --format=mp4 --disable_caching --media_dir media_final
              VIDEO=$(find media_final -type f -name Statistics10IQRBoxPlotConstruction.mp4 -print -quit)
              test -n "$VIDEO" && test -s "$VIDEO"
              cp "$VIDEO" delivery/Statistics10_IQR_BoxPlot_Construction_Professional_pqh.mp4
            '

      - name: Verify complete output and every frame boundary
        shell: bash
        run: |
          set -euo pipefail
          VIDEO=delivery/Statistics10_IQR_BoxPlot_Construction_Professional_pqh.mp4
          test -s "$VIDEO"
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=codec_name,profile,width,height,r_frame_rate,avg_frame_rate,pix_fmt,nb_frames \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            "$VIDEO" | tee delivery/FFPROBE.txt
          grep -qx 'codec_name=h264' delivery/FFPROBE.txt
          grep -qx 'width=1920' delivery/FFPROBE.txt
          grep -qx 'height=1080' delivery/FFPROBE.txt
          grep -qx 'r_frame_rate=30/1' delivery/FFPROBE.txt
          grep -qx 'pix_fmt=yuv420p' delivery/FFPROBE.txt
          ffmpeg -v error -i "$VIDEO" -f null -

          python - "$VIDEO" <<'PY'
          import subprocess, sys
          video = sys.argv[1]
          width, height = 320, 180
          frame_size = width * height
          border = [
              y * width + x
              for y in range(height)
              for x in range(width)
              if x < 2 or x >= width - 2 or y < 2 or y >= height - 2
          ]
          process = subprocess.Popen(
              [
                  'ffmpeg', '-v', 'error', '-i', video,
                  '-vf', f'scale={width}:{height},format=gray',
                  '-f', 'rawvideo', '-pix_fmt', 'gray', '-'
              ],
              stdout=subprocess.PIPE,
          )
          frames = 0
          maximum = 0
          violations = []
          while True:
              data = process.stdout.read(frame_size)
              if not data:
                  break
              assert len(data) == frame_size
              frames += 1
              dark = sum(data[index] < 96 for index in border)
              maximum = max(maximum, dark)
              if dark > 28 and len(violations) < 20:
                  violations.append((frames, dark))
          process.stdout.close()
          assert process.wait() == 0
          result = 'PASS' if not violations else 'REVIEW_REQUIRED'
          with open('delivery/ALL_FRAME_BORDER_SCAN.txt', 'w') as handle:
              handle.write(f'frames_scanned={frames}\n')
              handle.write(f'max_dark_border_pixels={maximum}\n')
              handle.write(f'violations={violations}\n')
              handle.write(f'result={result}\n')
          if violations:
              from pathlib import Path
              Path('delivery/border_diagnostics').mkdir(parents=True, exist_ok=True)
              for frame_number, dark_pixels in violations:
                  timestamp = max(0.0, (frame_number - 1) / 30.0)
                  subprocess.run([
                      'ffmpeg', '-y', '-v', 'error', '-ss', f'{timestamp:.6f}',
                      '-i', video, '-frames:v', '1',
                      f'delivery/border_diagnostics/frame_{frame_number:05d}_dark_{dark_pixels:03d}.png'
                  ], check=True)
          PY

      - name: Create visual QA, render report, and hashes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          VIDEO=delivery/Statistics10_IQR_BoxPlot_Construction_Professional_pqh.mp4
          mkdir -p delivery/qa_frames
          DURATION=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$VIDEO")
          python - "$DURATION" <<'PY'
          import subprocess, sys
          duration = float(sys.argv[1])
          fractions = [
              0.02,0.06,0.10,0.14,0.18,0.22,
              0.26,0.30,0.34,0.38,0.42,0.46,
              0.50,0.54,0.58,0.62,0.66,0.70,
              0.74,0.78,0.82,0.87,0.93,0.98,
          ]
          for index, fraction in enumerate(fractions, 1):
              timestamp = max(0.0, min(duration - 0.2, duration * fraction))
              subprocess.run([
                  'ffmpeg', '-y', '-v', 'error', '-ss', f'{timestamp:.3f}',
                  '-i', 'delivery/Statistics10_IQR_BoxPlot_Construction_Professional_pqh.mp4',
                  '-frames:v', '1', f'delivery/qa_frames/frame_{index:02d}.png'
              ], check=True)
          PY
          ffmpeg -y -v error -pattern_type glob -i 'delivery/qa_frames/frame_*.png' \
            -vf 'scale=420:-1,tile=4x6:padding=8:margin=8:color=white' \
            -frames:v 1 delivery/QA_CONTACT_SHEET.png

          cat > delivery/RENDER_INFO.txt <<'EOF'
          Scene: Statistics10IQRBoxPlotConstruction
          Source: statistics10_iqr_boxplot_construction_masterclass.py
          ManimCE: 0.20.1
          Format: horizontal 16:9
          Final resolution: 1920x1080
          Final frame rate: 30 fps
          Preview command: manim -pql statistics10_iqr_boxplot_construction_masterclass.py Statistics10IQRBoxPlotConstruction --format=mp4 --disable_caching
          Final command: manim -pqh statistics10_iqr_boxplot_construction_masterclass.py Statistics10IQRBoxPlotConstruction --format=mp4 --disable_caching
          Dataset: 4, 15, 3, 7, 2, 8, 4, 6, 5
          Ordered dataset: 2, 3, 4, 4, 5, 6, 7, 8, 15
          Quartile convention: for odd n, exclude the overall median before calculating Q1 and Q3.
          Verified values: Q1=3.5; Q2=5; Q3=7.5; IQR=4; lower fence=-2.5; upper fence=13.5; outlier=15; whiskers=2 and 8.
          EOF

          sha256sum \
            delivery/Statistics10_IQR_BoxPlot_Construction_Professional_pqh.mp4 \
            delivery/Statistics10_IQR_BoxPlot_Construction_pql.mp4 \
            delivery/statistics10_iqr_boxplot_construction_masterclass.py \
            delivery/QA_CONTACT_SHEET.png \
            > delivery/SHA256SUMS.txt
          cp delivery/FFPROBE.txt delivery/TECHNICAL_VERIFICATION.txt
          cat delivery/ALL_FRAME_BORDER_SCAN.txt >> delivery/TECHNICAL_VERIFICATION.txt
          cat delivery/SHA256SUMS.txt >> delivery/TECHNICAL_VERIFICATION.txt

      - name: Upload complete delivery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Statistics10-IQR-BoxPlot-Professional-pqh-v1
          path: delivery/
          if-no-files-found: error
          retention-days: 7
