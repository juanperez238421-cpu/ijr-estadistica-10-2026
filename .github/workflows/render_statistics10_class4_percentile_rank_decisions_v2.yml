name: Render Statistics 10 Class 4 V2 Percentile Rank Decisions SENIOR FINAL

on:
  workflow_dispatch:
  push:
    branches:
      - render/statistics10-class4-percentile-rank-decisions-v2-20260908
    paths:
      - 'render_jobs/statistics10_class4_percentile_rank_decisions_v2_20260908/TRIGGER_RENDER.txt'

permissions:
  contents: write
  actions: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout exact Class 4 V2 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull pinned ManimCE image
        run: docker pull manimcommunity/manim:v0.20.1

      - name: Run full Class 4 V2 senior render + QA protocol
        id: render_protocol
        run: bash render_jobs/statistics10_class4_percentile_rank_decisions_v2_20260908/run_pipeline.sh

      - name: Upload final MP4 and complete QA package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Statistics10-Class4-V2-Percentile-Rank-Decisions-SENIOR-FINAL-PQH
          retention-days: 30
          if-no-files-found: warn
          path: |
            render_jobs/statistics10_class4_percentile_rank_decisions_v2_20260908/delivery/
            render_jobs/statistics10_class4_percentile_rank_decisions_v2_20260908/qa_dense/
            render_jobs/statistics10_class4_percentile_rank_decisions_v2_20260908/qa_targeted/

      - name: Publish exact validated V2 MP4 and QA evidence to branch
        if: steps.render_protocol.outcome == 'success'
        run: |
          set -euo pipefail
          JOB='render_jobs/statistics10_class4_percentile_rank_decisions_v2_20260908'
          SRC="$JOB/delivery/Statistics10_Class4_Percentile_Rank_Decisions_V2_SENIOR_FINAL_pqh.mp4"
          DST_DIR='deliveries/statistics10_class4_percentile_rank_decisions_v2_final'
          test -s "$SRC"
          rm -rf "$DST_DIR"
          mkdir -p "$DST_DIR/qa_targeted"
          cp -a "$JOB/delivery/." "$DST_DIR/"
          cp -a "$JOB/qa_targeted/." "$DST_DIR/qa_targeted/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DST_DIR"
          if ! git diff --cached --quiet; then
            git commit -m 'delivery: publish Statistics 10 Class 4 V2 percentile-rank SENIOR FINAL PQH'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
