name: Render Statistics 10 Layout V6 PQH

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore exact source and verify SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delivery
          echo "337a2fb1c3e5886d764930b223082427c3883d81bee6732b477e6a7d9c0ee16a  source_chunks_layout_v6/part_00" | sha256sum -c -
          echo "b3b12f90b4011fb3d80c75d0d7a9693c0826976a7cee5a145b836077e91dbcee  source_chunks_layout_v6/part_01" | sha256sum -c -
          echo "8c286ad6a9c6d7d9a069bd6760dc30f58eeb6d5f022dffe83abe2e68a4d58ce8  source_chunks_layout_v6/part_02" | sha256sum -c -
          cat source_chunks_layout_v6/part_00 source_chunks_layout_v6/part_01 source_chunks_layout_v6/part_02 > source.gz.b64
          test "$(wc -c < source.gz.b64)" -eq 17824
          base64 -d source.gz.b64 | gzip -d > statistics10_frequency_variance_layout_v6.py
          test -s statistics10_frequency_variance_layout_v6.py
          echo "5169a1cd334a0b39afeef5daf3a436aaad19891eabbe4e879bc9b76099051e36  statistics10_frequency_variance_layout_v6.py" | sha256sum -c -

      - name: Validate source and mathematical claims
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile statistics10_frequency_variance_layout_v6.py
          grep -q '^class Statistics10FrequencyTableVarianceMasterclass' statistics10_frequency_variance_layout_v6.py
          ! grep -En '(color|fill_color|stroke_color)[[:space:]]*=[[:space:]]*(BLUE|RED|GREEN|ORANGE|PURPLE|TEAL|YELLOW)' statistics10_frequency_variance_layout_v6.py
          ! grep -En '([A-Za-z]:\\\\|/Users/|/home/[^/]+/Desktop)' statistics10_frequency_variance_layout_v6.py

      - name: Install verification tools and pull ManimCE
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          docker pull manimcommunity/manim:v0.20.1
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Execute numerical assertions
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -v "$PWD:/manim" \
            -w /manim \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c 'set -euo pipefail; python statistics10_frequency_variance_layout_v6.py'

      - name: Render complete preview with literal -pql
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=0.10 \
            -v "$PWD:/manim" \
            -w /manim \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c '
              set -euo pipefail
              mkdir -p /tmp/manim-home /tmp/manim-bin delivery
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH="/tmp/manim-bin:$PATH"
              manim -pql --fps 15 -r 854,480 \
                --format=mp4 --disable_caching \
                --media_dir media_preview \
                statistics10_frequency_variance_layout_v6.py \
                Statistics10FrequencyTableVarianceMasterclass
              VIDEO=$(find media_preview -type f -name Statistics10FrequencyTableVarianceMasterclass.mp4 -print -quit)
              test -n "$VIDEO"
              test -s "$VIDEO"
              cp "$VIDEO" delivery/Statistics10FrequencyVarianceLayoutV6_pql.mp4
            '
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt -show_entries format=duration,size -of default=noprint_wrappers=1 delivery/Statistics10FrequencyVarianceLayoutV6_pql.mp4 | tee delivery/PQL_FFPROBE.txt
          ffmpeg -v error -i delivery/Statistics10FrequencyVarianceLayoutV6_pql.mp4 -f null -

      - name: Render final classroom version with literal -pqh
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=1.00 \
            -v "$PWD:/manim" \
            -w /manim \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c '
              set -euo pipefail
              mkdir -p /tmp/manim-home /tmp/manim-bin delivery
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH="/tmp/manim-bin:$PATH"
              manim -pqh --fps 30 -r 1920,1080 \
                --format=mp4 --disable_caching \
                --media_dir media_final \
                statistics10_frequency_variance_layout_v6.py \
                Statistics10FrequencyTableVarianceMasterclass
              VIDEO=$(find media_final -type f -name Statistics10FrequencyTableVarianceMasterclass.mp4 -print -quit)
              test -n "$VIDEO"
              test -s "$VIDEO"
              cp "$VIDEO" delivery/Statistics10FrequencyVarianceLayoutV6_pqh.mp4
            '

      - name: Verify every frame, inspect representative frames, and package
        shell: bash
        run: |
          set -euo pipefail
          VIDEO=delivery/Statistics10FrequencyVarianceLayoutV6_pqh.mp4
          test -s "$VIDEO"
          cp statistics10_frequency_variance_layout_v6.py delivery/

          ffprobe -v error \
            -select_streams v:0 \
            -show_entries stream=codec_name,profile,width,height,r_frame_rate,avg_frame_rate,pix_fmt,nb_frames \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            "$VIDEO" | tee delivery/FFPROBE.txt
          grep -qx 'codec_name=h264' delivery/FFPROBE.txt
          grep -qx 'width=1920' delivery/FFPROBE.txt
          grep -qx 'height=1080' delivery/FFPROBE.txt
          grep -qx 'r_frame_rate=30/1' delivery/FFPROBE.txt
          grep -qx 'pix_fmt=yuv420p' delivery/FFPROBE.txt
          ffmpeg -v error -i "$VIDEO" -f null -

          # Decode every frame at low resolution and test the outer two-pixel
          # border for dark content. This catches text, boxes, or figures that
          # are clipped by the frame at any time in the animation.
          python - "$VIDEO" <<'PY'
          import subprocess
          import sys

          video = sys.argv[1]
          width, height = 320, 180
          frame_size = width * height
          border_indices = []
          for y in range(height):
              for x in range(width):
                  if x < 2 or x >= width - 2 or y < 2 or y >= height - 2:
                      border_indices.append(y * width + x)

          process = subprocess.Popen(
              [
                  'ffmpeg', '-v', 'error', '-i', video,
                  '-vf', f'scale={width}:{height},format=gray',
                  '-f', 'rawvideo', '-pix_fmt', 'gray', '-'
              ],
              stdout=subprocess.PIPE,
          )
          frame_count = 0
          violations = []
          max_dark = 0
          while True:
              data = process.stdout.read(frame_size)
              if not data:
                  break
              if len(data) != frame_size:
                  raise RuntimeError('Incomplete decoded frame')
              frame_count += 1
              dark = sum(1 for index in border_indices if data[index] < 96)
              max_dark = max(max_dark, dark)
              if dark > 24:
                  violations.append((frame_count, dark))
                  if len(violations) >= 20:
                      break
          process.stdout.close()
          status = process.wait()
          if status != 0:
              raise RuntimeError(f'FFmpeg frame scan failed with status {status}')
          print(f'frames_scanned={frame_count}')
          print(f'max_dark_border_pixels={max_dark}')
          if violations:
              raise RuntimeError(f'Possible clipping detected: {violations}')
          with open('delivery/ALL_FRAME_BORDER_SCAN.txt', 'w') as handle:
              handle.write(f'frames_scanned={frame_count}\n')
              handle.write(f'max_dark_border_pixels={max_dark}\n')
              handle.write('result=PASS\n')
          PY

          mkdir -p delivery/qa_frames
          DURATION=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$VIDEO")
          python - "$DURATION" <<'PY'
          import subprocess
          import sys
          duration = float(sys.argv[1])
          fractions = [0.015,0.05,0.09,0.14,0.19,0.24,0.29,0.34,0.39,0.44,0.49,0.54,0.59,0.64,0.69,0.74,0.79,0.84,0.89,0.94,0.985]
          for index, fraction in enumerate(fractions, start=1):
              timestamp = max(0.0, min(duration - 0.2, duration * fraction))
              subprocess.run([
                  'ffmpeg','-y','-v','error','-ss',f'{timestamp:.3f}',
                  '-i','delivery/Statistics10FrequencyVarianceLayoutV6_pqh.mp4',
                  '-frames:v','1',f'delivery/qa_frames/frame_{index:02d}.png'
              ], check=True)
          PY
          ffmpeg -y -v error -pattern_type glob -i 'delivery/qa_frames/frame_*.png' \
            -vf 'scale=480:-1,tile=3x7:padding=8:margin=8:color=white' \
            -frames:v 1 delivery/QA_CONTACT_SHEET.png

          cat > delivery/RENDER_INFO.txt <<'EOF'
          Scene: Statistics10FrequencyTableVarianceMasterclass
          Source: statistics10_frequency_variance_layout_v6.py
          ManimCE: 0.20.1
          Preview: manim -pql statistics10_frequency_variance_layout_v6.py Statistics10FrequencyTableVarianceMasterclass --format=mp4 --disable_caching
          Final: manim -pqh statistics10_frequency_variance_layout_v6.py Statistics10FrequencyTableVarianceMasterclass --format=mp4 --disable_caching
          Visual policy: black text and equations; monochrome lines and fills.
          Layout revision: reduced simultaneous density, larger tables, wrapped subtitles, enforced note-panel padding, sequential before/after table update, two-column final route.
          Dataset: 2, 2, 3, 4, 4, 4, 5, 6
          Mean: 3.75
          Population variance: 1.6875
          Population standard deviation: approximately 1.299
          EOF
          sha256sum delivery/Statistics10FrequencyVarianceLayoutV6_pqh.mp4 delivery/Statistics10FrequencyVarianceLayoutV6_pql.mp4 delivery/statistics10_frequency_variance_layout_v6.py delivery/QA_CONTACT_SHEET.png > delivery/SHA256SUMS.txt

      - name: Upload complete artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Statistics10FrequencyVarianceLayoutV6-pqh
          path: delivery/
          if-no-files-found: error
          retention-days: 7
