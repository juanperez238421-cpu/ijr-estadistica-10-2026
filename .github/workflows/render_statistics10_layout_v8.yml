name: Render Statistics 10 Layout V8 PQH

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore exact source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delivery
          echo "aeffdff74039915af9a5686c24c32ccff15252d8b8ae90c51291e5a6cf018731  source_chunks_layout_v8/part_00" | sha256sum -c -
          echo "2db9c3aafa6d25000c15464e8184ce3046932b8d48ef85dc3844e1181c31cf17  source_chunks_layout_v8/part_01" | sha256sum -c -
          echo "aa62162de1ba73a9be4b27603c8daea3caa302d51b1d2f5ba84cecb20724e488  source_chunks_layout_v8/part_02" | sha256sum -c -
          echo "c2ec6ec3adb494ab658858fa36333201fadbc3fbf45694fb1ca63097a1418dc3  source_chunks_layout_v8/part_03" | sha256sum -c -
          echo "2f324ebb1485ec706eabf29a178dc11c302a89521dc08257c924c4623cf53a0a  source_chunks_layout_v8/part_04" | sha256sum -c -
          echo "c4c0fbb2958b7a7bc8d7ccbbf9b557362b1872b7cc21a432e64aff3e82c2ee4f  source_chunks_layout_v8/part_05" | sha256sum -c -
          cat source_chunks_layout_v8/part_* > source.gz.b64
          test "$(wc -c < source.gz.b64)" -eq 17796
          base64 -d source.gz.b64 | gzip -d > statistics10_frequency_variance_layout_v8.py
          echo "bce789b25726baedaa87ddf550f47c6eea0d41e819ba07a50385dcf99f62047b  statistics10_frequency_variance_layout_v8.py" | sha256sum -c -
          cp statistics10_frequency_variance_layout_v8.py delivery/

      - name: Validate source and LaTeX
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile statistics10_frequency_variance_layout_v8.py
          grep -q '^class Statistics10FrequencyTableVarianceMasterclass' statistics10_frequency_variance_layout_v8.py
          ! grep -En '(color|fill_color|stroke_color)[[:space:]]*=[[:space:]]*(BLUE|RED|GREEN|ORANGE|PURPLE|TEAL|YELLOW)' statistics10_frequency_variance_layout_v8.py
          python - <<'PY'
          from pathlib import Path
          source = Path('statistics10_frequency_variance_layout_v8.py').read_text()
          bad_controls = [(i, ord(c)) for i, c in enumerate(source) if ord(c) < 32 and c not in '\n\t']
          assert not bad_controls, bad_controls[:20]
          for token in (r'\frac', r'\text', r'\bar', r'\approx'):
              assert token in source, token
          for fragment in ('rac{', 'ext{', 'ar{x}', 'pprox'):
              positions=[]
              start=0
              while True:
                  index=source.find(fragment,start)
                  if index < 0:
                      break
                  if index == 0 or source[index-1] != '\\':
                      positions.append(index)
                  start=index+1
              assert not positions, (fragment, positions[:20])
          print('Source and LaTeX audit passed.')
          PY

      - name: Prepare ManimCE and FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          docker pull manimcommunity/manim:v0.20.1

      - name: Numerical assertions
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -v "$PWD:/manim" -w /manim \
            --entrypoint bash manimcommunity/manim:v0.20.1 \
            -c 'set -euo pipefail; python statistics10_frequency_variance_layout_v8.py'

      - name: Literal pql preview
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=0.10 \
            -v "$PWD:/manim" -w /manim --entrypoint bash \
            manimcommunity/manim:v0.20.1 -c '
              set -euo pipefail
              mkdir -p /tmp/manim-home /tmp/manim-bin delivery
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH="/tmp/manim-bin:$PATH"
              manim -pql statistics10_frequency_variance_layout_v8.py \
                Statistics10FrequencyTableVarianceMasterclass \
                --format=mp4 --disable_caching --media_dir media_preview
              VIDEO=$(find media_preview -type f -name Statistics10FrequencyTableVarianceMasterclass.mp4 -print -quit)
              test -n "$VIDEO" && test -s "$VIDEO"
              cp "$VIDEO" delivery/Statistics10FrequencyVarianceLayoutV8_pql.mp4
            '
          ffmpeg -v error -i delivery/Statistics10FrequencyVarianceLayoutV8_pql.mp4 -f null -
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt -show_entries format=duration,size -of default=noprint_wrappers=1 delivery/Statistics10FrequencyVarianceLayoutV8_pql.mp4 | tee delivery/PQL_FFPROBE.txt

      - name: Literal pqh final render
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=1.00 \
            -v "$PWD:/manim" -w /manim --entrypoint bash \
            manimcommunity/manim:v0.20.1 -c '
              set -euo pipefail
              mkdir -p /tmp/manim-home /tmp/manim-bin delivery
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH="/tmp/manim-bin:$PATH"
              manim -pqh statistics10_frequency_variance_layout_v8.py \
                Statistics10FrequencyTableVarianceMasterclass \
                --format=mp4 --disable_caching --media_dir media_final
              VIDEO=$(find media_final -type f -name Statistics10FrequencyTableVarianceMasterclass.mp4 -print -quit)
              test -n "$VIDEO" && test -s "$VIDEO"
              cp "$VIDEO" delivery/Statistics10FrequencyVarianceLayoutV8_pqh.mp4
            '

      - name: Verify complete video and inspect all frames
        shell: bash
        run: |
          set -euo pipefail
          VIDEO=delivery/Statistics10FrequencyVarianceLayoutV8_pqh.mp4
          test -s "$VIDEO"
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=codec_name,profile,width,height,r_frame_rate,avg_frame_rate,pix_fmt,nb_frames \
            -show_entries format=duration,size -of default=noprint_wrappers=1 \
            "$VIDEO" | tee delivery/FFPROBE.txt
          grep -qx 'codec_name=h264' delivery/FFPROBE.txt
          grep -qx 'width=1920' delivery/FFPROBE.txt
          grep -qx 'height=1080' delivery/FFPROBE.txt
          grep -qx 'r_frame_rate=30/1' delivery/FFPROBE.txt
          grep -qx 'pix_fmt=yuv420p' delivery/FFPROBE.txt
          ffmpeg -v error -i "$VIDEO" -f null -

          python - "$VIDEO" <<'PY'
          import subprocess, sys
          video=sys.argv[1]
          width,height=320,180
          size=width*height
          border=[y*width+x for y in range(height) for x in range(width) if x<2 or x>=width-2 or y<2 or y>=height-2]
          process=subprocess.Popen(['ffmpeg','-v','error','-i',video,'-vf',f'scale={width}:{height},format=gray','-f','rawvideo','-pix_fmt','gray','-'],stdout=subprocess.PIPE)
          frames=0; maximum=0; violations=[]
          while True:
              data=process.stdout.read(size)
              if not data: break
              assert len(data)==size
              frames+=1
              dark=sum(data[index]<96 for index in border)
              maximum=max(maximum,dark)
              if dark>24 and len(violations)<20:
                  violations.append((frames,dark))
          process.stdout.close()
          assert process.wait()==0
          assert not violations, violations
          Path='delivery/ALL_FRAME_BORDER_SCAN.txt'
          open(Path,'w').write(f'frames_scanned={frames}\nmax_dark_border_pixels={maximum}\nresult=PASS\n')
          print(frames, maximum)
          PY

          mkdir -p delivery/qa_frames
          DURATION=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$VIDEO")
          python - "$DURATION" <<'PY'
          import subprocess,sys
          duration=float(sys.argv[1])
          fractions=[0.015,0.05,0.09,0.14,0.19,0.24,0.29,0.34,0.39,0.44,0.49,0.54,0.59,0.64,0.69,0.74,0.79,0.84,0.89,0.94,0.985]
          for index,fraction in enumerate(fractions,1):
              timestamp=max(0,min(duration-0.2,duration*fraction))
              subprocess.run(['ffmpeg','-y','-v','error','-ss',f'{timestamp:.3f}','-i','delivery/Statistics10FrequencyVarianceLayoutV8_pqh.mp4','-frames:v','1',f'delivery/qa_frames/frame_{index:02d}.png'],check=True)
          PY
          ffmpeg -y -v error -pattern_type glob -i 'delivery/qa_frames/frame_*.png' -vf 'scale=480:-1,tile=3x7:padding=8:margin=8:color=white' -frames:v 1 delivery/QA_CONTACT_SHEET.png

          cat > delivery/RENDER_INFO.txt <<'EOF'
          Scene: Statistics10FrequencyTableVarianceMasterclass
          Source: statistics10_frequency_variance_layout_v8.py
          ManimCE: 0.20.1
          Preview: manim -pql statistics10_frequency_variance_layout_v8.py Statistics10FrequencyTableVarianceMasterclass --format=mp4 --disable_caching
          Final: manim -pqh statistics10_frequency_variance_layout_v8.py Statistics10FrequencyTableVarianceMasterclass --format=mp4 --disable_caching
          Revision: larger typography and tables, wrapped subtitles, card padding, sequential table update, stacked checks, two-column summary.
          EOF
          sha256sum delivery/Statistics10FrequencyVarianceLayoutV8_pqh.mp4 delivery/Statistics10FrequencyVarianceLayoutV8_pql.mp4 delivery/statistics10_frequency_variance_layout_v8.py delivery/QA_CONTACT_SHEET.png > delivery/SHA256SUMS.txt

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Statistics10FrequencyVarianceLayoutV8-pqh
          path: delivery/
          if-no-files-found: error
          retention-days: 7
