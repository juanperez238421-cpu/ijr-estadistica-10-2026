name: Render Physics 9 Motion V5 Frame Audit Preview

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct V5 frame-audited source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p library tools delivery
          echo 'b87de70c2d518faf94822c9eab40f5271bb86fd4ea71ae8ef85a6d55d0b63c50  render_motion_v4/source_v4.part01' | sha256sum -c -
          echo 'da5a1ee37c2b321aa7432b8f5914bb788ead8873e73bd5152bf5d6ebe134f3ec  render_motion_v4/source_v4.part02' | sha256sum -c -
          echo '9b23aa84df462e030a1a3a9a227a519812ed658d1a3b4ee80a753f99ff1d6086  render_motion_v4/source_v4.part03' | sha256sum -c -
          echo '9442462b562ceb38bd994a1e8d5158f27ff2d484da74d3ede37b1293e62a88c0  render_motion_v4/source_v4.part04' | sha256sum -c -
          echo '3afff039a7793ce746c77bb326234ddc4d9da85123b4acb04cef34c5542c25d4  render_motion_v4/source_v4.part05' | sha256sum -c -
          cat render_motion_v4/source_v4.part0{1,2,3,4,5} > /tmp/v4.b64
          echo 'cee2bab40b7114aa986d91505334183b102ffee703a1dce171e945f72800b586  /tmp/v4.b64' | sha256sum -c -
          base64 -d /tmp/v4.b64 | gzip -d > physics9_motion_achilles_v4_senior.py
          echo 'fa062f56872a807dc2add7e46183290651910945134981a4dad465808810e2a9  physics9_motion_achilles_v4_senior.py' | sha256sum -c -
          patch -p0 < render_motion_v4/deep_zoom_final.patch
          echo 'c93ee486ad0471d3fcaf278b3b00e49b17aef86cabf3ac1839383d2cc8fd19ef  physics9_motion_achilles_v4_senior.py' | sha256sum -c -

          echo 'eb9558fa0d8a4e1455b7494e328793c15a16a00ebe849330285ee9045eeb84c1  render_motion_v5/v4_to_v5_frame_audit.patch.gz.b64' | sha256sum -c -
          base64 -d render_motion_v5/v4_to_v5_frame_audit.patch.gz.b64 | gzip -d > /tmp/v5.patch
          echo '0fb250855e6ea243a73d85233d27d3ac58338b0af9d1871c9b441642c5cf521f  /tmp/v5.patch' | sha256sum -c -
          patch -p0 < /tmp/v5.patch
          echo '1bcbc6b7060f5ecc4a74de2112d88789bdd331c01f148b503f6e066c629658eb  physics9_motion_achilles_v4_senior.py' | sha256sum -c -
          mv physics9_motion_achilles_v4_senior.py physics9_motion_achilles_v5_frame_audited.py
          echo '1bcbc6b7060f5ecc4a74de2112d88789bdd331c01f148b503f6e066c629658eb  physics9_motion_achilles_v5_frame_audited.py' | sha256sum -c -

          base64 -d render_motion_exact_20260810/style_exact.b64 | gzip -d > library/jp_classroom_style.py
          base64 -d render_motion_exact_20260810/checker_exact.b64 | gzip -d > tools/check_manim_style.py
          touch library/__init__.py
          echo '3f3f06e94d5cad870ad335502cc1a93e56ce675abb1231ded5f9c71fd3e60e3d  library/jp_classroom_style.py' | sha256sum -c -
          echo 'd2f6c4ceaf8ff41dcf2312aaf54b1b92a4211985d67c97fa749cd56123ffdbd9  tools/check_manim_style.py' | sha256sum -c -
          cp physics9_motion_achilles_v5_frame_audited.py delivery/

      - name: Static and style QA
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile physics9_motion_achilles_v5_frame_audited.py
          python tools/check_manim_style.py physics9_motion_achilles_v5_frame_audited.py | tee delivery/STYLE_QA.txt
          grep -q 'PASS: no structural/style issues detected.' delivery/STYLE_QA.txt

      - name: Prepare ManimCE 0.20.1
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          docker pull manimcommunity/manim:v0.20.1

      - name: Numerical assertions
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/manim-home -v "$PWD:/manim" -w /manim --entrypoint bash manimcommunity/manim:v0.20.1 -c 'python physics9_motion_achilles_v5_frame_audited.py' | tee delivery/MOTION_ASSERTIONS.txt
          grep -q 'Motion lesson assertions passed.' delivery/MOTION_ASSERTIONS.txt

      - name: Full literal pql preview
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=0.10 -v "$PWD:/manim" -w /manim --entrypoint bash manimcommunity/manim:v0.20.1 -c '
            set -euo pipefail
            mkdir -p /tmp/manim-home /tmp/manim-bin
            printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
            chmod +x /tmp/manim-bin/xdg-open
            export PATH="/tmp/manim-bin:$PATH"
            manim -pql --fps 15 -r 854,480 physics9_motion_achilles_v5_frame_audited.py Physics9MotionAchillesFull --format=mp4 --disable_caching --media_dir media_preview
          '
          V=$(find media_preview -type f -name Physics9MotionAchillesFull.mp4 -print -quit)
          test -n "$V" && test -s "$V"
          cp "$V" delivery/Physics9_Motion_Achilles_V5_FRAME_AUDIT_PREVIEW_pql.mp4
          ffmpeg -v error -i delivery/Physics9_Motion_Achilles_V5_FRAME_AUDIT_PREVIEW_pql.mp4 -f null -

      - name: Dense temporal QA
        shell: bash
        run: |
          set -euo pipefail
          V=delivery/Physics9_Motion_Achilles_V5_FRAME_AUDIT_PREVIEW_pql.mp4
          mkdir -p delivery/qa_dense delivery/qa_scenes
          D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$V")
          python - "$D" <<'PY'
          import subprocess, sys
          v='delivery/Physics9_Motion_Achilles_V5_FRAME_AUDIT_PREVIEW_pql.mp4'
          d=float(sys.argv[1])
          for i in range(60):
              t=max(0,min(d-.03,d*(i+0.5)/60))
              subprocess.run(['ffmpeg','-y','-v','error','-ss',f'{t:.3f}','-i',v,'-frames:v','1',f'delivery/qa_dense/frame_{i+1:02d}.png'],check=True)
          scene_ranges=[(0,.035),(.035,.22),(.22,.38),(.38,.53),(.53,.60),(.60,.71),(.71,.79),(.79,.89),(.89,.995)]
          for s,(a,b) in enumerate(scene_ranges):
              for j in range(6):
                  f=a+(b-a)*(j+.5)/6
                  t=max(0,min(d-.03,d*f))
                  subprocess.run(['ffmpeg','-y','-v','error','-ss',f'{t:.3f}','-i',v,'-frames:v','1',f'delivery/qa_scenes/s{s:02d}_{j+1:02d}.png'],check=True)
          PY
          ffmpeg -y -v error -pattern_type glob -i 'delivery/qa_dense/frame_*.png' -vf 'scale=360:-1,tile=6x10:padding=6:margin=6:color=white' -frames:v 1 delivery/DENSE_QA_CONTACT_SHEET.png
          for s in 00 01 02 03 04 05 06 07 08; do
            ffmpeg -y -v error -pattern_type glob -i "delivery/qa_scenes/s${s}_*.png" -vf 'scale=640:-1,tile=3x2:padding=8:margin=8:color=white' -frames:v 1 "delivery/SCENE_${s}_QA.png"
          done

      - name: Hash preview delivery
        shell: bash
        run: |
          sha256sum delivery/Physics9_Motion_Achilles_V5_FRAME_AUDIT_PREVIEW_pql.mp4 delivery/physics9_motion_achilles_v5_frame_audited.py delivery/DENSE_QA_CONTACT_SHEET.png > delivery/SHA256_PREVIEW.txt

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: Physics9-Motion-Achilles-V5-FrameAudit-Preview
          path: delivery/
          if-no-files-found: error
          retention-days: 7
