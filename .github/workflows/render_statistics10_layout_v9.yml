name: Render Statistics 10 Layout V9 PQH

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore byte-verified source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delivery
          echo "8fc2ab4cea3b86587d88f319d33ad45c062e316aaa811c83cac4c7c37d600202  source_chunks_layout_v9/part_00" | sha256sum -c -
          echo "2fdbddb68cb83d907f2a101b99d589180ed3b0718e786056a4c8ca692df3070e  source_chunks_layout_v9/part_01" | sha256sum -c -
          echo "3747376c50a997e86822429e5898b85e804f2f5663d8e81430a95865e4e2662e  source_chunks_layout_v9/part_02" | sha256sum -c -
          echo "49df7e11ac2c1c7b965503d28bdcf73d9c0f0672a0f88a50522c54efaa765690  source_chunks_layout_v9/part_03" | sha256sum -c -
          echo "1a6ecc4173cab595982f632953682abb2f789f8aafc7e36d67a4c1a154fb6573  source_chunks_layout_v9/part_04" | sha256sum -c -
          echo "0a7d378582b2a8499c8eca348e45887cadc935a0833441c437edc23f7890c2da  source_chunks_layout_v9/part_05" | sha256sum -c -
          echo "6d3547d494bd842d40a055c7612c5f9e15e39ea272e54c872235ed81e8a755f9  source_chunks_layout_v9/part_06" | sha256sum -c -
          cat source_chunks_layout_v9/part_* > source.gz.b64
          test "$(wc -c < source.gz.b64)" -eq 18156
          base64 -d source.gz.b64 | gzip -d > statistics10_frequency_variance_layout_v9.py
          test -s statistics10_frequency_variance_layout_v9.py
          echo "4ac6569cbeefb63dc590fe4e9aefbd150473f925daa70afbf1deaa16bd07a73c  statistics10_frequency_variance_layout_v9.py" | sha256sum -c -
          cp statistics10_frequency_variance_layout_v9.py delivery/

      - name: Validate Python, equations, and visual policy
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile statistics10_frequency_variance_layout_v9.py
          grep -q '^class Statistics10FrequencyTableVarianceMasterclass' statistics10_frequency_variance_layout_v9.py
          ! grep -En '(color|fill_color|stroke_color)[[:space:]]*=[[:space:]]*(BLUE|RED|GREEN|ORANGE|PURPLE|TEAL|YELLOW)' statistics10_frequency_variance_layout_v9.py
          python - <<'PY'
          from pathlib import Path
          source = Path('statistics10_frequency_variance_layout_v9.py').read_text()
          controls = [(i, ord(c)) for i, c in enumerate(source) if ord(c) < 32 and c not in '\n\t']
          assert not controls, controls[:20]
          for token in (r'\frac', r'\text', r'\bar', r'\approx'):
              assert token in source, token
          assert 'self.play(FadeOut(formulas)' in source
          assert 'self.play(FadeOut(formula)' in source
          assert 'self.play(FadeOut(identity)' in source
          assert 'FadeOut(item) for item in persistent' in source
          print('Static source audit passed.')
          PY

      - name: Prepare official ManimCE and FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          docker pull manimcommunity/manim:v0.20.1

      - name: Execute numerical assertions
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -v "$PWD:/manim" -w /manim \
            --entrypoint bash manimcommunity/manim:v0.20.1 \
            -c 'set -euo pipefail; python statistics10_frequency_variance_layout_v9.py'

      - name: Render literal pql preview
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=0.10 \
            -v "$PWD:/manim" -w /manim --entrypoint bash \
            manimcommunity/manim:v0.20.1 -c '
              set -euo pipefail
              mkdir -p /tmp/manim-home /tmp/manim-bin delivery
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH="/tmp/manim-bin:$PATH"
              manim -pql statistics10_frequency_variance_layout_v9.py \
                Statistics10FrequencyTableVarianceMasterclass \
                --format=mp4 --disable_caching --media_dir media_preview
              VIDEO=$(find media_preview -type f -name Statistics10FrequencyTableVarianceMasterclass.mp4 -print -quit)
              test -n "$VIDEO" && test -s "$VIDEO"
              cp "$VIDEO" delivery/Statistics10FrequencyVarianceLayoutV9_pql.mp4
            '
          ffmpeg -v error -i delivery/Statistics10FrequencyVarianceLayoutV9_pql.mp4 -f null -
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt -show_entries format=duration,size -of default=noprint_wrappers=1 delivery/Statistics10FrequencyVarianceLayoutV9_pql.mp4 | tee delivery/PQL_FFPROBE.txt

      - name: Render literal pqh final video
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=1.00 \
            -v "$PWD:/manim" -w /manim --entrypoint bash \
            manimcommunity/manim:v0.20.1 -c '
              set -euo pipefail
              mkdir -p /tmp/manim-home /tmp/manim-bin delivery
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH="/tmp/manim-bin:$PATH"
              manim -pqh statistics10_frequency_variance_layout_v9.py \
                Statistics10FrequencyTableVarianceMasterclass \
                --format=mp4 --disable_caching --media_dir media_final
              VIDEO=$(find media_final -type f -name Statistics10FrequencyTableVarianceMasterclass.mp4 -print -quit)
              test -n "$VIDEO" && test -s "$VIDEO"
              cp "$VIDEO" delivery/Statistics10FrequencyVarianceLayoutV9_pqh.mp4
            '

      - name: Verify all frames and create QA package
        shell: bash
        run: |
          set -euo pipefail
          VIDEO=delivery/Statistics10FrequencyVarianceLayoutV9_pqh.mp4
          test -s "$VIDEO"
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=codec_name,profile,width,height,r_frame_rate,avg_frame_rate,pix_fmt,nb_frames \
            -show_entries format=duration,size -of default=noprint_wrappers=1 \
            "$VIDEO" | tee delivery/FFPROBE.txt
          grep -qx 'codec_name=h264' delivery/FFPROBE.txt
          grep -qx 'width=1920' delivery/FFPROBE.txt
          grep -qx 'height=1080' delivery/FFPROBE.txt
          grep -qx 'r_frame_rate=30/1' delivery/FFPROBE.txt
          grep -qx 'pix_fmt=yuv420p' delivery/FFPROBE.txt
          ffmpeg -v error -i "$VIDEO" -f null -

          python - "$VIDEO" <<'PY'
          import subprocess, sys
          video = sys.argv[1]
          width, height = 320, 180
          size = width * height
          border = [y * width + x for y in range(height) for x in range(width) if x < 2 or x >= width - 2 or y < 2 or y >= height - 2]
          process = subprocess.Popen(['ffmpeg','-v','error','-i',video,'-vf',f'scale={width}:{height},format=gray','-f','rawvideo','-pix_fmt','gray','-'], stdout=subprocess.PIPE)
          frames = 0
          maximum = 0
          violations = []
          while True:
              data = process.stdout.read(size)
              if not data:
                  break
              assert len(data) == size
              frames += 1
              dark = sum(data[index] < 96 for index in border)
              maximum = max(maximum, dark)
              if dark > 24 and len(violations) < 20:
                  violations.append((frames, dark))
          process.stdout.close()
          assert process.wait() == 0
          assert not violations, violations
          open('delivery/ALL_FRAME_BORDER_SCAN.txt','w').write(f'frames_scanned={frames}\nmax_dark_border_pixels={maximum}\nresult=PASS\n')
          print(f'frames_scanned={frames}; max_dark_border_pixels={maximum}')
          PY

          mkdir -p delivery/qa_frames
          DURATION=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$VIDEO")
          python - "$DURATION" <<'PY'
          import subprocess, sys
          duration = float(sys.argv[1])
          fractions = [0.01,0.04,0.07,0.10,0.13,0.16,0.19,0.22,0.25,0.28,0.31,0.34,0.37,0.40,0.43,0.46,0.49,0.52,0.55,0.58,0.61,0.64,0.67,0.70,0.73,0.76,0.79,0.82,0.85,0.88,0.91,0.94,0.97,0.99]
          for index, fraction in enumerate(fractions, 1):
              timestamp = max(0.0, min(duration - 0.2, duration * fraction))
              subprocess.run(['ffmpeg','-y','-v','error','-ss',f'{timestamp:.3f}','-i','delivery/Statistics10FrequencyVarianceLayoutV9_pqh.mp4','-frames:v','1',f'delivery/qa_frames/frame_{index:02d}.png'], check=True)
          PY
          ffmpeg -y -v error -pattern_type glob -i 'delivery/qa_frames/frame_*.png' -vf 'scale=420:-1,tile=5x7:padding=8:margin=8:color=white' -frames:v 1 delivery/QA_CONTACT_SHEET.png

          cat > delivery/RENDER_INFO.txt <<'EOF'
          Scene: Statistics10FrequencyTableVarianceMasterclass
          Source: statistics10_frequency_variance_layout_v9.py
          ManimCE: 0.20.1
          Preview: manim -pql statistics10_frequency_variance_layout_v9.py Statistics10FrequencyTableVarianceMasterclass --format=mp4 --disable_caching
          Final: manim -pqh statistics10_frequency_variance_layout_v9.py Statistics10FrequencyTableVarianceMasterclass --format=mp4 --disable_caching
          Layout changes: larger typography and tables; wrapped subtitles; panel padding; sequential table update; stacked checks; formulas staged before tables; headers hidden during camera focus; two-column summary.
          EOF
          sha256sum delivery/Statistics10FrequencyVarianceLayoutV9_pqh.mp4 delivery/Statistics10FrequencyVarianceLayoutV9_pql.mp4 delivery/statistics10_frequency_variance_layout_v9.py delivery/QA_CONTACT_SHEET.png > delivery/SHA256SUMS.txt

      - name: Upload complete artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Statistics10FrequencyVarianceLayoutV9-pqh
          path: delivery/
          if-no-files-found: error
          retention-days: 7
