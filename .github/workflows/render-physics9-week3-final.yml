name: Physics 9 Week 3 Acceleration CINEMATIC V3 FINAL PQH

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct approved Week 3 V3 source and exact JP dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p library tools delivery
          cat render_physics9_week3/source_part_00.pyfrag \
              render_physics9_week3/source_part_01.pyfrag \
              render_physics9_week3/source_part_02.pyfrag \
              render_physics9_week3/source_part_03.pyfrag \
              render_physics9_week3/source_part_04.pyfrag \
              > physics9_week3_acceleration_galileo.py
          echo '539627bb7f00f3e8f192e0cc0040dec2895a200af8df812ebfa096093b1b0e96  physics9_week3_acceleration_galileo.py' | sha256sum -c -
          python render_physics9_week3/apply_week3_v2_fixes.py
          echo '4a26dccad452dec424a0fcf7f631680e7dfceb36c473ad3aef75de683d8972ad  physics9_week3_acceleration_galileo.py' | sha256sum -c -
          python render_physics9_week3/apply_week3_v3_motion_text_fix.py
          echo '315bcb5d213f2a740033b44fe97ca5cb77e7028fb40f47d81e17f737240d2104  physics9_week3_acceleration_galileo.py' | sha256sum -c -

          git fetch --depth=1 origin render/physics9-week2-vt-cinematic-v2-2026-08-10
          git show FETCH_HEAD:render_physics9_week2/style_exact.b64 > /tmp/style_exact.b64
          git show FETCH_HEAD:render_physics9_week2/checker_exact.b64 > /tmp/checker_exact.b64
          echo '4a5c21279f5c7ae1b4daffa3928bf1eb0dbdde6873ae688161c87e9987663a74  /tmp/style_exact.b64' | sha256sum -c -
          echo 'da1d43b8499b4613090d88689af8fadaa39a7280f65403e965aee8f96032a605  /tmp/checker_exact.b64' | sha256sum -c -
          base64 -d /tmp/style_exact.b64 | gzip -d > library/jp_classroom_style.py
          base64 -d /tmp/checker_exact.b64 | gzip -d > tools/check_manim_style.py
          touch library/__init__.py
          echo '3f3f06e94d5cad870ad335502cc1a93e56ce675abb1231ded5f9c71fd3e60e3d  library/jp_classroom_style.py' | sha256sum -c -
          echo 'd2f6c4ceaf8ff41dcf2312aaf54b1b92a4211985d67c97fa749cd56123ffdbd9  tools/check_manim_style.py' | sha256sum -c -
          cp physics9_week3_acceleration_galileo.py delivery/Physics9_Week3_Acceleration_Galileo_CINEMATIC_V3.py

      - name: Static source validation
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile physics9_week3_acceleration_galileo.py
          python tools/check_manim_style.py physics9_week3_acceleration_galileo.py | tee delivery/STYLE_QA.txt
          grep -q 'PASS: no structural/style issues detected.' delivery/STYLE_QA.txt
          grep -q 'class Physics9Week3AccelerationTheory' physics9_week3_acceleration_galileo.py
          grep -q 'class Physics9Week3AccelerationProblems' physics9_week3_acceleration_galileo.py

      - name: Prepare official ManimCE 0.20.1
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          docker pull manimcommunity/manim:v0.20.1

      - name: Numerical lesson assertions
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/manim-home -v "$PWD:/manim" -w /manim --entrypoint bash manimcommunity/manim:v0.20.1 -c 'python physics9_week3_acceleration_galileo.py' | tee delivery/ASSERTIONS.txt
          grep -q 'Physics 9 Week 3 acceleration lesson assertions passed.' delivery/ASSERTIONS.txt

      - name: Complete literal pql protocol renders
        shell: bash
        run: |
          set -euo pipefail
          for S in Physics9Week3AccelerationTheory Physics9Week3AccelerationProblems; do
            docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=0.10 -v "$PWD:/manim" -w /manim --entrypoint bash manimcommunity/manim:v0.20.1 -c "
              set -euo pipefail
              mkdir -p /tmp/manim-home /tmp/manim-bin
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=\"/tmp/manim-bin:\$PATH\"
              manim -pql --fps 15 -r 854,480 physics9_week3_acceleration_galileo.py $S --format=mp4 --disable_caching --media_dir media_preview_$S
            "
            V=$(find "media_preview_$S" -type f -name "$S.mp4" -print -quit)
            test -n "$V" && test -s "$V"
            cp "$V" "delivery/${S}_PREVIEW_pql.mp4"
            ffmpeg -v error -i "delivery/${S}_PREVIEW_pql.mp4" -f null -
          done

      - name: Final literal pqh renders
        shell: bash
        run: |
          set -euo pipefail
          for S in Physics9Week3AccelerationTheory Physics9Week3AccelerationProblems; do
            docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=1.00 -v "$PWD:/manim" -w /manim --entrypoint bash manimcommunity/manim:v0.20.1 -c "
              set -euo pipefail
              mkdir -p /tmp/manim-home /tmp/manim-bin
              printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH=\"/tmp/manim-bin:\$PATH\"
              manim -pqh --fps 30 -r 1920,1080 physics9_week3_acceleration_galileo.py $S --format=mp4 --disable_caching --media_dir media_final_$S
            "
            V=$(find "media_final_$S" -type f -name "$S.mp4" -print -quit)
            test -n "$V" && test -s "$V"
            if [ "$S" = 'Physics9Week3AccelerationTheory' ]; then
              OUT='delivery/Physics9_Week3_Acceleration_Galileo_CINEMATIC_V3_THEORY_FINAL_PQH.mp4'
            else
              OUT='delivery/Physics9_Week3_Acceleration_CINEMATIC_V3_WORKED_PROBLEMS_FINAL_PQH.mp4'
            fi
            cp "$V" "$OUT"
          done

      - name: Technical verification
        shell: bash
        run: |
          set -euo pipefail
          : > delivery/FFPROBE.txt
          for V in delivery/Physics9_Week3_Acceleration_Galileo_CINEMATIC_V3_THEORY_FINAL_PQH.mp4 delivery/Physics9_Week3_Acceleration_CINEMATIC_V3_WORKED_PROBLEMS_FINAL_PQH.mp4; do
            echo "===== $(basename "$V") =====" | tee -a delivery/FFPROBE.txt
            ffprobe -v error -show_entries stream=codec_name,profile,width,height,pix_fmt,r_frame_rate,avg_frame_rate,nb_frames:format=duration,size -of default=noprint_wrappers=1 "$V" | tee -a delivery/FFPROBE.txt
            ffprobe -v error -show_entries stream=codec_name,width,height,pix_fmt,r_frame_rate -of csv=p=0 "$V" | grep -q 'h264,1920,1080,yuv420p,30/1'
            ffmpeg -v error -i "$V" -f null -
          done
          echo 'PASS: both Week 3 full PQH MP4s decoded completely without FFmpeg errors.' | tee delivery/TECHNICAL_VERIFICATION.txt

      - name: Dense full-HD visual QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delivery/qa_theory delivery/qa_problems delivery/qa_targeted
          python - <<'PY'
          import subprocess
          uniform=[
              ('delivery/Physics9_Week3_Acceleration_Galileo_CINEMATIC_V3_THEORY_FINAL_PQH.mp4',140,'delivery/qa_theory'),
              ('delivery/Physics9_Week3_Acceleration_CINEMATIC_V3_WORKED_PROBLEMS_FINAL_PQH.mp4',120,'delivery/qa_problems'),
          ]
          for v,n,out in uniform:
              d=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','csv=p=0',v],text=True))
              for i in range(n):
                  t=max(0,min(d-.05,d*(i+.5)/n))
                  subprocess.run(['ffmpeg','-y','-v','error','-ss',f'{t:.3f}','-i',v,'-frames:v','1',f'{out}/frame_{i+1:03d}.png'],check=True)

          targets=[
              ('delivery/Physics9_Week3_Acceleration_Galileo_CINEMATIC_V3_THEORY_FINAL_PQH.mp4','signs',.29,.48,48),
              ('delivery/Physics9_Week3_Acceleration_Galileo_CINEMATIC_V3_THEORY_FINAL_PQH.mp4','galileo',.60,.80,56),
              ('delivery/Physics9_Week3_Acceleration_CINEMATIC_V3_WORKED_PROBLEMS_FINAL_PQH.mp4','piecewise',.48,.73,64),
              ('delivery/Physics9_Week3_Acceleration_CINEMATIC_V3_WORKED_PROBLEMS_FINAL_PQH.mp4','cards',.68,.86,48),
          ]
          for v,name,f0,f1,n in targets:
              d=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','csv=p=0',v],text=True))
              for i in range(n):
                  t=d*(f0+(f1-f0)*(i+.5)/n)
                  subprocess.run(['ffmpeg','-y','-v','error','-ss',f'{t:.3f}','-i',v,'-frames:v','1',f'delivery/qa_targeted/{name}_{i+1:03d}.png'],check=True)
          PY
          ffmpeg -y -v error -pattern_type glob -i 'delivery/qa_theory/frame_*.png' -vf 'scale=280:-1,tile=10x14:padding=4:margin=4:color=white' -frames:v 1 delivery/THEORY_140_FRAME_FINAL_QA.png
          ffmpeg -y -v error -pattern_type glob -i 'delivery/qa_problems/frame_*.png' -vf 'scale=300:-1,tile=12x10:padding=4:margin=4:color=white' -frames:v 1 delivery/PROBLEMS_120_FRAME_FINAL_QA.png
          ffmpeg -y -v error -pattern_type glob -i 'delivery/qa_targeted/signs_*.png' -vf 'scale=410:-1,tile=8x6:padding=5:margin=5:color=white' -frames:v 1 delivery/SIGNS_48_FRAME_FINAL_QA.png
          ffmpeg -y -v error -pattern_type glob -i 'delivery/qa_targeted/galileo_*.png' -vf 'scale=390:-1,tile=8x7:padding=5:margin=5:color=white' -frames:v 1 delivery/GALILEO_56_FRAME_FINAL_QA.png
          ffmpeg -y -v error -pattern_type glob -i 'delivery/qa_targeted/piecewise_*.png' -vf 'scale=380:-1,tile=8x8:padding=5:margin=5:color=white' -frames:v 1 delivery/PIECEWISE_64_FRAME_FINAL_QA.png
          ffmpeg -y -v error -pattern_type glob -i 'delivery/qa_targeted/cards_*.png' -vf 'scale=410:-1,tile=8x6:padding=5:margin=5:color=white' -frames:v 1 delivery/CARDS_48_FRAME_FINAL_QA.png

      - name: Report and hashes
        shell: bash
        run: |
          set -euo pipefail
          cat > delivery/RENDER_INFO.txt <<'EOF'
          Physics 9 — Week 3: Acceleration + Galileo Quantitative Bridge
          Final cinematic V3 delivery.
          A) Theory: acceleration definition, m/s^2 meaning, sign logic, v-t slope, constant acceleration, Galileo quantitative bridge, motion cases.
          B) Worked Problems: positive acceleration, braking, negative-velocity sign cases, piecewise v-t to a-t, velocity cards, Galileo acceleration.
          Approved source SHA-256: 315bcb5d213f2a740033b44fe97ca5cb77e7028fb40f47d81e17f737240d2104
          Renderer: official manimcommunity/manim:v0.20.1
          Protocol preview: literal -pql, 854x480, 15 fps, LESSON_TIME_SCALE=0.10
          Final: literal -pqh, 1920x1080, 30 fps, LESSON_TIME_SCALE=1.00
          Historical framing: Galileo numerical ramp data remain explicitly schematic, not exact historical measurements.
          Final QA: 140 theory frames + 120 problems frames + 48 sign frames + 56 Galileo frames + 64 piecewise frames + 48 velocity-card frames.
          V3 visual correction: geometry-to-LaTeX morphs removed after preview QA detected a transient interpolation artifact.
          EOF
          sha256sum \
            delivery/Physics9_Week3_Acceleration_Galileo_CINEMATIC_V3_THEORY_FINAL_PQH.mp4 \
            delivery/Physics9_Week3_Acceleration_CINEMATIC_V3_WORKED_PROBLEMS_FINAL_PQH.mp4 \
            delivery/Physics9_Week3_Acceleration_Galileo_CINEMATIC_V3.py \
            delivery/THEORY_140_FRAME_FINAL_QA.png \
            delivery/PROBLEMS_120_FRAME_FINAL_QA.png \
            delivery/SIGNS_48_FRAME_FINAL_QA.png \
            delivery/GALILEO_56_FRAME_FINAL_QA.png \
            delivery/PIECEWISE_64_FRAME_FINAL_QA.png \
            delivery/CARDS_48_FRAME_FINAL_QA.png \
            > delivery/SHA256SUMS.txt

      - name: Upload final cinematic package
        uses: actions/upload-artifact@v4
        with:
          name: Physics9-Week3-Acceleration-CINEMATIC-V3-FINAL-PQH
          path: delivery/
          if-no-files-found: error
          retention-days: 7
