name: Render Statistics 10 Layout V7 PQH

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore exact corrected source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delivery
          echo "d765d3f2c293ebdf837c6860155b815294e58832686e41efca6f958bda89019f  source_chunks_layout_v7/part_00" | sha256sum -c -
          echo "d2973cbf2c48e79814d284acb2d4dc609f08fc672ebbff24cf72e3bc39e6c485  source_chunks_layout_v7/part_01" | sha256sum -c -
          echo "b27245feb7d32793e06aeac0cc525ef5202bdfc14f6d840c5669e1fa9195c996  source_chunks_layout_v7/part_02" | sha256sum -c -
          cat source_chunks_layout_v7/part_00 source_chunks_layout_v7/part_01 source_chunks_layout_v7/part_02 > source.gz.b64
          test "$(wc -c < source.gz.b64)" -eq 17796
          base64 -d source.gz.b64 | gzip -d > statistics10_frequency_variance_layout_v7.py
          test -s statistics10_frequency_variance_layout_v7.py
          echo "bce789b25726baedaa87ddf550f47c6eea0d41e819ba07a50385dcf99f62047b  statistics10_frequency_variance_layout_v7.py" | sha256sum -c -
          cp statistics10_frequency_variance_layout_v7.py delivery/

      - name: Validate Python, layout policy, and LaTeX strings
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile statistics10_frequency_variance_layout_v7.py
          grep -q '^class Statistics10FrequencyTableVarianceMasterclass' statistics10_frequency_variance_layout_v7.py
          ! grep -En '(color|fill_color|stroke_color)[[:space:]]*=[[:space:]]*(BLUE|RED|GREEN|ORANGE|PURPLE|TEAL|YELLOW)' statistics10_frequency_variance_layout_v7.py
          ! grep -En '([A-Za-z]:\\\\|/Users/|/home/[^/]+/Desktop)' statistics10_frequency_variance_layout_v7.py
          python - <<'PY'
          from pathlib import Path
          source = Path('statistics10_frequency_variance_layout_v7.py').read_text()
          controls = [(i, ord(char)) for i, char in enumerate(source) if ord(char) < 32 and char not in '\n\t']
          if controls:
              raise SystemExit(f'Unexpected control characters: {controls[:20]}')
          required = [r'\frac', r'\text', r'\bar', r'\approx']
          for token in required:
              if token not in source:
                  raise SystemExit(f'Missing expected LaTeX token: {token}')
          for malformed in ('rac{', 'ext{', 'ar{x}', 'pprox'):
              positions = []
              start = 0
              while True:
                  index = source.find(malformed, start)
                  if index < 0:
                      break
                  preceding = source[index - 1] if index else ''
                  if preceding != '\\':
                      positions.append(index)
                  start = index + 1
              if positions:
                  raise SystemExit(f'Malformed LaTeX fragment {malformed}: {positions[:20]}')
          print('LaTeX string audit passed.')
          PY

      - name: Install verification tools and pull ManimCE
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          docker pull manimcommunity/manim:v0.20.1

      - name: Execute numerical assertions
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -v "$PWD:/manim" -w /manim \
            --entrypoint bash manimcommunity/manim:v0.20.1 \
            -c 'set -euo pipefail; python statistics10_frequency_variance_layout_v7.py'

      - name: Render full preview with literal -pql
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=0.10 \
            -v "$PWD:/manim" -w /manim \
            --entrypoint bash manimcommunity/manim:v0.20.1 \
            -c '
              set -euo pipefail
              mkdir -p /tmp/manim-home /tmp/manim-bin delivery
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH="/tmp/manim-bin:$PATH"
              manim -pql statistics10_frequency_variance_layout_v7.py \
                Statistics10FrequencyTableVarianceMasterclass \
                --format=mp4 --disable_caching --media_dir media_preview
              VIDEO=$(find media_preview -type f -name Statistics10FrequencyTableVarianceMasterclass.mp4 -print -quit)
              test -n "$VIDEO" && test -s "$VIDEO"
              cp "$VIDEO" delivery/Statistics10FrequencyVarianceLayoutV7_pql.mp4
            '
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt -show_entries format=duration,size -of default=noprint_wrappers=1 delivery/Statistics10FrequencyVarianceLayoutV7_pql.mp4 | tee delivery/PQL_FFPROBE.txt
          ffmpeg -v error -i delivery/Statistics10FrequencyVarianceLayoutV7_pql.mp4 -f null -

      - name: Render final version with literal -pqh
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=1.00 \
            -v "$PWD:/manim" -w /manim \
            --entrypoint bash manimcommunity/manim:v0.20.1 \
            -c '
              set -euo pipefail
              mkdir -p /tmp/manim-home /tmp/manim-bin delivery
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH="/tmp/manim-bin:$PATH"
              manim -pqh statistics10_frequency_variance_layout_v7.py \
                Statistics10FrequencyTableVarianceMasterclass \
                --format=mp4 --disable_caching --media_dir media_final
              VIDEO=$(find media_final -type f -name Statistics10FrequencyTableVarianceMasterclass.mp4 -print -quit)
              test -n "$VIDEO" && test -s "$VIDEO"
              cp "$VIDEO" delivery/Statistics10FrequencyVarianceLayoutV7_pqh.mp4
            '

      - name: Verify all frames and package delivery
        shell: bash
        run: |
          set -euo pipefail
          VIDEO=delivery/Statistics10FrequencyVarianceLayoutV7_pqh.mp4
          test -s "$VIDEO"
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=codec_name,profile,width,height,r_frame_rate,avg_frame_rate,pix_fmt,nb_frames \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 "$VIDEO" | tee delivery/FFPROBE.txt
          grep -qx 'codec_name=h264' delivery/FFPROBE.txt
          grep -qx 'width=1920' delivery/FFPROBE.txt
          grep -qx 'height=1080' delivery/FFPROBE.txt
          grep -qx 'r_frame_rate=30/1' delivery/FFPROBE.txt
          grep -qx 'pix_fmt=yuv420p' delivery/FFPROBE.txt
          ffmpeg -v error -i "$VIDEO" -f null -

          python - "$VIDEO" <<'PY'
          import subprocess, sys
          video = sys.argv[1]
          width, height = 320, 180
          frame_size = width * height
          border = [y * width + x for y in range(height) for x in range(width) if x < 2 or x >= width - 2 or y < 2 or y >= height - 2]
          process = subprocess.Popen(['ffmpeg','-v','error','-i',video,'-vf',f'scale={width}:{height},format=gray','-f','rawvideo','-pix_fmt','gray','-'], stdout=subprocess.PIPE)
          count = 0
          max_dark = 0
          violations = []
          while True:
              data = process.stdout.read(frame_size)
              if not data:
                  break
              if len(data) != frame_size:
                  raise RuntimeError('Incomplete decoded frame')
              count += 1
              dark = sum(data[index] < 96 for index in border)
              max_dark = max(max_dark, dark)
              if dark > 24 and len(violations) < 20:
                  violations.append((count, dark))
          process.stdout.close()
          status = process.wait()
          if status != 0:
              raise RuntimeError(f'FFmpeg scan failed: {status}')
          if violations:
              raise RuntimeError(f'Possible clipping at frames: {violations}')
          with open('delivery/ALL_FRAME_BORDER_SCAN.txt','w') as handle:
              handle.write(f'frames_scanned={count}\nmax_dark_border_pixels={max_dark}\nresult=PASS\n')
          print(f'frames_scanned={count}; max_dark_border_pixels={max_dark}')
          PY

          mkdir -p delivery/qa_frames
          DURATION=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$VIDEO")
          python - "$DURATION" <<'PY'
          import subprocess, sys
          duration = float(sys.argv[1])
          fractions = [0.015,0.05,0.09,0.14,0.19,0.24,0.29,0.34,0.39,0.44,0.49,0.54,0.59,0.64,0.69,0.74,0.79,0.84,0.89,0.94,0.985]
          for index, fraction in enumerate(fractions, 1):
              timestamp = max(0.0, min(duration - 0.2, duration * fraction))
              subprocess.run(['ffmpeg','-y','-v','error','-ss',f'{timestamp:.3f}','-i','delivery/Statistics10FrequencyVarianceLayoutV7_pqh.mp4','-frames:v','1',f'delivery/qa_frames/frame_{index:02d}.png'], check=True)
          PY
          ffmpeg -y -v error -pattern_type glob -i 'delivery/qa_frames/frame_*.png' -vf 'scale=480:-1,tile=3x7:padding=8:margin=8:color=white' -frames:v 1 delivery/QA_CONTACT_SHEET.png

          cat > delivery/RENDER_INFO.txt <<'EOF'
          Scene: Statistics10FrequencyTableVarianceMasterclass
          Source: statistics10_frequency_variance_layout_v7.py
          ManimCE: 0.20.1
          Preview command: manim -pql statistics10_frequency_variance_layout_v7.py Statistics10FrequencyTableVarianceMasterclass --format=mp4 --disable_caching
          Final command: manim -pqh statistics10_frequency_variance_layout_v7.py Statistics10FrequencyTableVarianceMasterclass --format=mp4 --disable_caching
          Layout revision: larger type and tables, wrapped subtitles, internal card padding, sequential table update, stacked checks, two-column final route.
          Dataset: 2, 2, 3, 4, 4, 4, 5, 6
          Mean: 3.75
          Population variance: 1.6875
          Population standard deviation: approximately 1.299
          EOF
          sha256sum delivery/Statistics10FrequencyVarianceLayoutV7_pqh.mp4 delivery/Statistics10FrequencyVarianceLayoutV7_pql.mp4 delivery/statistics10_frequency_variance_layout_v7.py delivery/QA_CONTACT_SHEET.png > delivery/SHA256SUMS.txt

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Statistics10FrequencyVarianceLayoutV7-pqh
          path: delivery/
          if-no-files-found: error
          retention-days: 7
