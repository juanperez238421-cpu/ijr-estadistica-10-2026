name: Physics 9 V4 Scene 01 Final QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct final V4
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p library tools delivery
          cat render_motion_v4/source_v4.part0{1,2,3,4,5} > /tmp/v4.b64
          echo 'cee2bab40b7114aa986d91505334183b102ffee703a1dce171e945f72800b586  /tmp/v4.b64' | sha256sum -c -
          base64 -d /tmp/v4.b64 | gzip -d > physics9_motion_achilles_v4_senior.py
          echo 'fa062f56872a807dc2add7e46183290651910945134981a4dad465808810e2a9  physics9_motion_achilles_v4_senior.py' | sha256sum -c -
          patch -p0 < render_motion_v4/deep_zoom_final.patch
          echo 'c93ee486ad0471d3fcaf278b3b00e49b17aef86cabf3ac1839383d2cc8fd19ef  physics9_motion_achilles_v4_senior.py' | sha256sum -c -
          base64 -d render_motion_exact_20260810/style_exact.b64 | gzip -d > library/jp_classroom_style.py
          touch library/__init__.py
          cat > scene01_driver.py <<'PY'
          from physics9_motion_achilles_v4_senior import Physics9MotionAchillesFull
          class Scene01FinalQA(Physics9MotionAchillesFull):
              def construct(self):
                  self.scene_01_paradox_setup()
          PY
          cp physics9_motion_achilles_v4_senior.py delivery/
      - name: Prepare and render scene 01
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          docker pull manimcommunity/manim:v0.20.1
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=0.12 -v "$PWD:/manim" -w /manim --entrypoint bash manimcommunity/manim:v0.20.1 -c '
            set -euo pipefail
            mkdir -p /tmp/manim-home /tmp/manim-bin
            printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
            chmod +x /tmp/manim-bin/xdg-open
            export PATH="/tmp/manim-bin:$PATH"
            manim -pql --fps 15 -r 854,480 scene01_driver.py Scene01FinalQA --format=mp4 --disable_caching --media_dir media_scene01
          '
          V=$(find media_scene01 -type f -name Scene01FinalQA.mp4 -print -quit)
          test -n "$V" && test -s "$V"
          cp "$V" delivery/Scene01FinalQA_pql.mp4
          ffmpeg -v error -i delivery/Scene01FinalQA_pql.mp4 -f null -
      - name: Targeted QA frames
        shell: bash
        run: |
          set -euo pipefail
          V=delivery/Scene01FinalQA_pql.mp4
          mkdir -p delivery/qa
          D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$V")
          python - "$D" <<'PY'
          import subprocess, sys
          v='delivery/Scene01FinalQA_pql.mp4'; d=float(sys.argv[1])
          for i,f in enumerate([.05,.15,.28,.40,.52,.64,.72,.78,.84,.90,.96],1):
              t=d*f
              subprocess.run(['ffmpeg','-y','-v','error','-ss',f'{t:.3f}','-i',v,'-frames:v','1',f'delivery/qa/frame_{i:02d}.png'],check=True)
          PY
          ffmpeg -y -v error -pattern_type glob -i 'delivery/qa/frame_*.png' -vf 'scale=650:-1,tile=4x3:padding=8:margin=8:color=white' -frames:v 1 delivery/SCENE01_FINAL_QA.png
      - uses: actions/upload-artifact@v4
        with:
          name: Physics9-V4-Scene01-FinalQA
          path: delivery/
          retention-days: 7
