name: Render Statistics 10 Glossary PQH

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore complete Python source
        run: |
          base64 -d statistics10_glossary_masterclass.py.gz.b64 \
            | gzip -d > statistics10_glossary_masterclass.py
          test -s statistics10_glossary_masterclass.py

      - name: Pull official ManimCE image
        run: docker pull manimcommunity/manim:v0.20.1

      - name: Validate Python syntax
        run: python -m py_compile statistics10_glossary_masterclass.py

      - name: Render required low-quality validation with literal -pql
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=0.15 \
            -v "$PWD:/manim" \
            -w /manim \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c '
              set -euo pipefail
              mkdir -p /tmp/manim-home /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH="/tmp/manim-bin:$PATH"
              python statistics10_glossary_masterclass.py
              manim -pql --fps 15 -r 854,480 \
                --format=mp4 --disable_caching \
                --media_dir media_preview \
                statistics10_glossary_masterclass.py \
                Statistics10GlossaryMasterclass
            '

      - name: Render final high-quality video with literal -pqh
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=1.0 \
            -v "$PWD:/manim" \
            -w /manim \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c '
              set -euo pipefail
              mkdir -p /tmp/manim-home /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH="/tmp/manim-bin:$PATH"
              manim -pqh --fps 30 -r 1920,1080 \
                --format=mp4 --disable_caching \
                --media_dir media_final \
                statistics10_glossary_masterclass.py \
                Statistics10GlossaryMasterclass
            '

      - name: Verify and stage delivery
        run: |
          set -euo pipefail
          mkdir -p delivery
          PREVIEW="$(find media_preview -type f -name 'Statistics10GlossaryMasterclass.mp4' -print -quit)"
          FINAL="$(find media_final -type f -name 'Statistics10GlossaryMasterclass.mp4' -print -quit)"
          test -s "$PREVIEW"
          test -s "$FINAL"
          cp "$PREVIEW" delivery/Statistics10GlossaryMasterclass_pql_preview.mp4
          cp "$FINAL" delivery/Statistics10GlossaryMasterclass_pqh.mp4
          cp statistics10_glossary_masterclass.py delivery/
          ffprobe -v error \
            -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            delivery/Statistics10GlossaryMasterclass_pqh.mp4 \
            | tee delivery/FFPROBE.txt
          sha256sum delivery/* > delivery/SHA256SUMS.txt

      - name: Upload render artifact
        uses: actions/upload-artifact@v4
        with:
          name: Statistics10GlossaryMasterclass-pqh
          path: delivery/
          if-no-files-found: error
          retention-days: 7
