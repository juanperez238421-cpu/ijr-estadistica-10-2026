name: Physics 9 Motion V5.3 Scene01 Transition QA
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct V5.3 exact source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p library tools delivery
          cat render_motion_v4/source_v4.part0{1,2,3,4,5} > /tmp/v4.b64
          base64 -d /tmp/v4.b64 | gzip -d > physics9_motion_achilles_v4_senior.py
          echo 'fa062f56872a807dc2add7e46183290651910945134981a4dad465808810e2a9  physics9_motion_achilles_v4_senior.py' | sha256sum -c -
          patch -p0 < render_motion_v4/deep_zoom_final.patch
          echo 'c93ee486ad0471d3fcaf278b3b00e49b17aef86cabf3ac1839383d2cc8fd19ef  physics9_motion_achilles_v4_senior.py' | sha256sum -c -
          base64 -d render_motion_v5/v4_to_v5_frame_audit.patch.gz.b64 | gzip -d > /tmp/v5.patch
          patch -p0 < /tmp/v5.patch
          mv physics9_motion_achilles_v4_senior.py physics9_motion_achilles_v5_frame_audited.py
          patch -p0 < render_motion_v5/v5_to_v5_1_layout_fix.patch
          patch -p0 < render_motion_v5/v5_1_to_v5_2_final_layout.patch
          mv physics9_motion_achilles_v5_frame_audited.py physics9_motion_achilles_v5_2_frame_audited.py
          echo 'd55d1d6f184b333a1cd2cdce7769fcb20b22d445fcd4ac0e93c902e32767c75f  physics9_motion_achilles_v5_2_frame_audited.py' | sha256sum -c -
          patch -p0 < render_motion_v5/v5_2_to_v5_3_no_text_morph.patch
          echo '71c4b8f619e5957d3fb9d6edd3fb9769abb57c5c30a9ee39f08a3a486444405f  physics9_motion_achilles_v5_2_frame_audited.py' | sha256sum -c -
          mv physics9_motion_achilles_v5_2_frame_audited.py physics9_motion_achilles_v5_3_no_text_morph.py
          base64 -d render_motion_exact_20260810/style_exact.b64 | gzip -d > library/jp_classroom_style.py
          base64 -d render_motion_exact_20260810/checker_exact.b64 | gzip -d > tools/check_manim_style.py
          touch library/__init__.py
          python -m py_compile physics9_motion_achilles_v5_3_no_text_morph.py
          python tools/check_manim_style.py physics9_motion_achilles_v5_3_no_text_morph.py | tee delivery/STYLE_QA.txt
          grep -q 'PASS: no structural/style issues detected.' delivery/STYLE_QA.txt
          cp physics9_motion_achilles_v5_3_no_text_morph.py delivery/
          cat > scene01_driver.py <<'PY'
          import physics9_motion_achilles_v5_3_no_text_morph as lesson
          class Scene01TransitionQA(lesson.Physics9MotionAchillesFull):
              def construct(self): self.scene_01_paradox_setup()
          PY
      - name: Prepare and render literal pql
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          docker pull manimcommunity/manim:v0.20.1
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=0.10 -v "$PWD:/manim" -w /manim --entrypoint bash manimcommunity/manim:v0.20.1 -c '
            set -euo pipefail
            mkdir -p /tmp/manim-home /tmp/manim-bin
            printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
            chmod +x /tmp/manim-bin/xdg-open
            export PATH="/tmp/manim-bin:$PATH"
            manim -pql --fps 15 -r 854,480 scene01_driver.py Scene01TransitionQA --format=mp4 --disable_caching --media_dir media_scene01
          '
          V=$(find media_scene01 -type f -name Scene01TransitionQA.mp4 -print -quit)
          cp "$V" delivery/Scene01TransitionQA.mp4
          ffmpeg -v error -i delivery/Scene01TransitionQA.mp4 -f null -
      - name: Dense transition frames
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delivery/qa
          D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 delivery/Scene01TransitionQA.mp4)
          python - "$D" <<'PY'
          import subprocess, sys
          v='delivery/Scene01TransitionQA.mp4'; d=float(sys.argv[1])
          for i in range(36):
              t=max(0,min(d-.02,d*(i+.5)/36))
              subprocess.run(['ffmpeg','-y','-v','error','-ss',f'{t:.3f}','-i',v,'-frames:v','1',f'delivery/qa/frame_{i+1:02d}.png'],check=True)
          PY
          ffmpeg -y -v error -pattern_type glob -i 'delivery/qa/frame_*.png' -vf 'scale=480:-1,tile=6x6:padding=7:margin=7:color=white' -frames:v 1 delivery/SCENE01_36_FRAME_TRANSITION_QA.png
      - uses: actions/upload-artifact@v4
        with:
          name: Physics9-Motion-Achilles-V5-3-Scene01-Transition-QA
          path: delivery/
          retention-days: 7
