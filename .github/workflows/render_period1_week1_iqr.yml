name: Render Period 1 Week 1 IQR

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax validation
        run: |
          python -m py_compile manim/period1_week1_iqr/statistics10_period1_week1_iqr_recovery_render.py

      - name: Pull fixed ManimCE image
        run: docker pull manimcommunity/manim:v0.20.1

      - name: Low-quality protocol validation (-pql)
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -v "$PWD:/manim" \
            -w /manim \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c '
              set -euo pipefail
              mkdir -p /tmp/manim-home /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH="/tmp/manim-bin:$PATH"
              manim -pql manim/period1_week1_iqr/statistics10_period1_week1_iqr_recovery_render.py Statistics10Period1Week1IQRRecovery --format=mp4 --disable_caching
            '

      - name: Final high-quality render (-pqh)
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -v "$PWD:/manim" \
            -w /manim \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c '
              set -euo pipefail
              mkdir -p /tmp/manim-home /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH="/tmp/manim-bin:$PATH"
              manim -pqh manim/period1_week1_iqr/statistics10_period1_week1_iqr_recovery_render.py Statistics10Period1Week1IQRRecovery --format=mp4 --disable_caching
            '

      - name: Verify and package
        run: |
          set -euo pipefail
          mkdir -p delivery
          FINAL="$(find media/videos -type f -path '*1080p*' -name 'Statistics10Period1Week1IQRRecovery.mp4' | head -n 1)"
          test -n "$FINAL"
          cp "$FINAL" delivery/Statistics10_Period1_Week1_IQR_Recovery_pqh.mp4
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/manim" \
            -w /manim \
            --entrypoint ffprobe \
            manimcommunity/manim:v0.20.1 \
            -v error -select_streams v:0 \
            -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt \
            -of default=noprint_wrappers=1 \
            delivery/Statistics10_Period1_Week1_IQR_Recovery_pqh.mp4 | tee delivery/FFPROBE.txt
          sha256sum delivery/Statistics10_Period1_Week1_IQR_Recovery_pqh.mp4 | tee delivery/SHA256.txt
          printf '%s\n' 'manim -pql statistics10_period1_week1_iqr_recovery_render.py Statistics10Period1Week1IQRRecovery --format=mp4 --disable_caching' 'manim -pqh statistics10_period1_week1_iqr_recovery_render.py Statistics10Period1Week1IQRRecovery --format=mp4 --disable_caching' > delivery/RENDER_COMMANDS.txt

      - name: Upload render artifact
        uses: actions/upload-artifact@v4
        with:
          name: Statistics10-Period1-Week1-IQR-pqh
          path: |
            delivery/Statistics10_Period1_Week1_IQR_Recovery_pqh.mp4
            delivery/FFPROBE.txt
            delivery/SHA256.txt
            delivery/RENDER_COMMANDS.txt
            manim/period1_week1_iqr/statistics10_period1_week1_iqr_recovery_render.py
          if-no-files-found: error
          retention-days: 7
