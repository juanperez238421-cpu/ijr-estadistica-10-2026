name: Render Statistics 10 P3W3 Percentiles Post-Robledista

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4

      - name: Pull fixed ManimCE image
        run: docker pull manimcommunity/manim:v0.20.1

      - name: Static compile and numerical assertions
        run: |
          docker run --rm \
            -v "$PWD:/manim" -w /manim \
            manimcommunity/manim:v0.20.1 \
            bash -c '
              set -euo pipefail
              python -m py_compile library/jp_classroom_style.py
              python -m py_compile manim/period3_week3_percentiles/scene.py
              python -c "import importlib.util, pathlib; p=pathlib.Path(\"manim/period3_week3_percentiles/scene.py\"); spec=importlib.util.spec_from_file_location(\"statistics10_p3w3_scene\", p); m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m); m.validate_all_data(); print(\"Numerical assertions: PASS\")"
            '

      - name: Literal PQL preview validation
        run: |
          docker run --rm \
            -v "$PWD:/manim" -w /manim \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c '
              set -euo pipefail
              mkdir -p /tmp/bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/bin/xdg-open
              chmod +x /tmp/bin/xdg-open
              export PATH="/tmp/bin:$PATH"
              manim -pql manim/period3_week3_percentiles/scene.py \
                Statistics10Period3Week3PercentilesPostRobledista \
                --format=mp4 --disable_caching
            '

      - name: Literal PQH final render
        run: |
          docker run --rm \
            -v "$PWD:/manim" -w /manim \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c '
              set -euo pipefail
              mkdir -p /tmp/bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/bin/xdg-open
              chmod +x /tmp/bin/xdg-open
              export PATH="/tmp/bin:$PATH"
              manim -pqh manim/period3_week3_percentiles/scene.py \
                Statistics10Period3Week3PercentilesPostRobledista \
                --format=mp4 --disable_caching
            '

      - name: Locate, verify and package final MP4
        run: |
          set -euo pipefail
          mkdir -p delivery
          FINAL_MP4="$(find media/videos -type f -name 'Statistics10Period3Week3PercentilesPostRobledista.mp4' | sort | tail -n 1)"
          test -n "$FINAL_MP4"
          cp "$FINAL_MP4" delivery/Statistics10_P3W3_Quartiles_Deciles_Percentiles_PostRobledista_FINAL_pqh.mp4

          docker run --rm -v "$PWD:/manim" -w /manim manimcommunity/manim:v0.20.1 \
            ffprobe -v error -select_streams v:0 \
            -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt \
            -of default=noprint_wrappers=1 \
            delivery/Statistics10_P3W3_Quartiles_Deciles_Percentiles_PostRobledista_FINAL_pqh.mp4 \
            | tee delivery/ffprobe.txt

          grep -q '^codec_name=h264$' delivery/ffprobe.txt
          grep -q '^width=1920$' delivery/ffprobe.txt
          grep -q '^height=1080$' delivery/ffprobe.txt
          grep -q '^r_frame_rate=30/1$' delivery/ffprobe.txt
          grep -q '^pix_fmt=yuv420p$' delivery/ffprobe.txt

          docker run --rm -v "$PWD:/manim" -w /manim manimcommunity/manim:v0.20.1 \
            ffmpeg -v error -i delivery/Statistics10_P3W3_Quartiles_Deciles_Percentiles_PostRobledista_FINAL_pqh.mp4 \
            -f null -

          sha256sum delivery/Statistics10_P3W3_Quartiles_Deciles_Percentiles_PostRobledista_FINAL_pqh.mp4 \
            | tee delivery/SHA256SUMS.txt
          cp manim/period3_week3_percentiles/scene.py delivery/
          cp manim/period3_week3_percentiles/STORYBOARD.md delivery/
          cp manim/period3_week3_percentiles/README_RENDER.md delivery/
          cp library/jp_classroom_style.py delivery/

      - name: Upload verified delivery artifact
        uses: actions/upload-artifact@v4
        with:
          name: Statistics10-P3W3-Percentiles-PostRobledista-pqh
          path: delivery/
          if-no-files-found: error
