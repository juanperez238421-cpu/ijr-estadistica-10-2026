name: Render Period 1 Week 2 Quartiles

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore exact lesson source
        run: |
          set -euo pipefail
          SRC_DIR="manim/period1_week2_quartiles"
          base64 -d "$SRC_DIR/statistics10_period1_week2_quartiles_positions.py.gz.b64" | gzip -d > "$SRC_DIR/statistics10_period1_week2_quartiles_positions.py"
          sha256sum "$SRC_DIR/statistics10_period1_week2_quartiles_positions.py"

      - name: Syntax validation
        run: python -m py_compile manim/period1_week2_quartiles/statistics10_period1_week2_quartiles_positions.py

      - name: Pull fixed ManimCE image
        run: docker pull manimcommunity/manim:v0.20.1

      - name: Low-quality protocol validation (-pql)
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -v "$PWD:/manim" \
            -w /manim \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c '
              set -euo pipefail
              mkdir -p /tmp/manim-home /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH="/tmp/manim-bin:$PATH"
              manim -pql manim/period1_week2_quartiles/statistics10_period1_week2_quartiles_positions.py Statistics10Period1Week2QuartilesPositions --format=mp4 --disable_caching
            '

      - name: Final high-quality render (-pqh)
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -v "$PWD:/manim" \
            -w /manim \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c '
              set -euo pipefail
              mkdir -p /tmp/manim-home /tmp/manim-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH="/tmp/manim-bin:$PATH"
              manim -pqh manim/period1_week2_quartiles/statistics10_period1_week2_quartiles_positions.py Statistics10Period1Week2QuartilesPositions --format=mp4 --disable_caching
            '

      - name: Verify and package
        run: |
          set -euo pipefail
          mkdir -p delivery
          FINAL="$(find media/videos -type f -path '*1080p*' -name 'Statistics10Period1Week2QuartilesPositions.mp4' | head -n 1)"
          test -n "$FINAL"
          cp "$FINAL" delivery/Statistics10_Period1_Week2_Quartiles_Positions_pqh.mp4
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=codec_name,profile,width,height,r_frame_rate,avg_frame_rate,pix_fmt \
            -show_entries format=duration \
            -of default=noprint_wrappers=1 \
            delivery/Statistics10_Period1_Week2_Quartiles_Positions_pqh.mp4 | tee delivery/FFPROBE.txt
          sha256sum delivery/Statistics10_Period1_Week2_Quartiles_Positions_pqh.mp4 | tee delivery/SHA256.txt
          sha256sum manim/period1_week2_quartiles/statistics10_period1_week2_quartiles_positions.py | tee delivery/SOURCE_SHA256.txt
          printf '%s\n' \
            'manim -pql statistics10_period1_week2_quartiles_positions.py Statistics10Period1Week2QuartilesPositions --format=mp4 --disable_caching' \
            'manim -pqh statistics10_period1_week2_quartiles_positions.py Statistics10Period1Week2QuartilesPositions --format=mp4 --disable_caching' \
            > delivery/RENDER_COMMANDS.txt

      - name: Upload render artifact
        uses: actions/upload-artifact@v4
        with:
          name: Statistics10-Period1-Week2-Quartiles-pqh
          path: |
            delivery/Statistics10_Period1_Week2_Quartiles_Positions_pqh.mp4
            delivery/FFPROBE.txt
            delivery/SHA256.txt
            delivery/SOURCE_SHA256.txt
            delivery/RENDER_COMMANDS.txt
            manim/period1_week2_quartiles/statistics10_period1_week2_quartiles_positions.py
          if-no-files-found: error
          retention-days: 7
