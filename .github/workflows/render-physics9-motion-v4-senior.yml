name: Render Physics 9 Motion V4 Senior Preview

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct exact V4 source and JP dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p library tools delivery
          echo '4eabc71ec68ccb3322d684daff415feb68e915d1177a83eaa9c2d38e4ffe7214  render_motion_v4/source_v4.part01' | sha256sum -c -
          echo 'c906988e3ff50af497e34cf7a963e08b78cca1446f4742b017035cb091079264  render_motion_v4/source_v4.part02' | sha256sum -c -
          echo '82525f348e8c566ca6cec19317a8865b5409dff2d6b0e149f59fe052cfb67e5c  render_motion_v4/source_v4.part03' | sha256sum -c -
          echo '557553be52e58b671fe676014aa72616d2e07c74355825590125f39d772211d3  render_motion_v4/source_v4.part04' | sha256sum -c -
          echo 'dcceb8c144d47fb4ecfbf2c6b04b9aac77134e7efa0c0bb15e3586d95e34831e  render_motion_v4/source_v4.part05' | sha256sum -c -
          cat render_motion_v4/source_v4.part01 render_motion_v4/source_v4.part02 render_motion_v4/source_v4.part03 render_motion_v4/source_v4.part04 render_motion_v4/source_v4.part05 > /tmp/v4.b64
          echo 'b67b37ef8321731dbe54938d67b408fabc276b2ee78102a8b75c0953c9422df6  /tmp/v4.b64' | sha256sum -c -
          base64 -d /tmp/v4.b64 | gzip -d > physics9_motion_achilles_v4_senior.py
          echo '939a5dc5cfe931d23a79407cd9df7ba70047bbe1054b746882b3bc894d70b9c0  physics9_motion_achilles_v4_senior.py' | sha256sum -c -

          base64 -d render_motion_exact_20260810/style_exact.b64 | gzip -d > library/jp_classroom_style.py
          base64 -d render_motion_exact_20260810/checker_exact.b64 | gzip -d > tools/check_manim_style.py
          touch library/__init__.py
          echo '3f3f06e94d5cad870ad335502cc1a93e56ce675abb1231ded5f9c71fd3e60e3d  library/jp_classroom_style.py' | sha256sum -c -
          echo 'd2f6c4ceaf8ff41dcf2312aaf54b1b92a4211985d67c97fa749cd56123ffdbd9  tools/check_manim_style.py' | sha256sum -c -
          cp physics9_motion_achilles_v4_senior.py delivery/

      - name: Static QA
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile physics9_motion_achilles_v4_senior.py
          python tools/check_manim_style.py physics9_motion_achilles_v4_senior.py | tee delivery/STYLE_QA.txt
          grep -q 'PASS: no structural/style issues detected.' delivery/STYLE_QA.txt

      - name: Prepare ManimCE 0.20.1
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          docker pull manimcommunity/manim:v0.20.1

      - name: Numerical assertions
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/manim-home -v "$PWD:/manim" -w /manim --entrypoint bash manimcommunity/manim:v0.20.1 -c 'python physics9_motion_achilles_v4_senior.py' | tee delivery/MOTION_ASSERTIONS.txt
          grep -q 'Motion lesson assertions passed.' delivery/MOTION_ASSERTIONS.txt

      - name: Full literal pql preview
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=0.10 -v "$PWD:/manim" -w /manim --entrypoint bash manimcommunity/manim:v0.20.1 -c '
            set -euo pipefail
            mkdir -p /tmp/manim-home /tmp/manim-bin
            printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
            chmod +x /tmp/manim-bin/xdg-open
            export PATH="/tmp/manim-bin:$PATH"
            manim -pql --fps 15 -r 854,480 physics9_motion_achilles_v4_senior.py Physics9MotionAchillesFull --format=mp4 --disable_caching --media_dir media_preview
          '
          V=$(find media_preview -type f -name Physics9MotionAchillesFull.mp4 -print -quit)
          test -n "$V" && test -s "$V"
          cp "$V" delivery/Physics9_Motion_Achilles_V4_PREVIEW_pql.mp4
          ffmpeg -v error -i delivery/Physics9_Motion_Achilles_V4_PREVIEW_pql.mp4 -f null -

      - name: Preview QA frames
        shell: bash
        run: |
          set -euo pipefail
          V=delivery/Physics9_Motion_Achilles_V4_PREVIEW_pql.mp4
          mkdir -p delivery/qa_preview
          D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$V")
          python - "$D" <<'PY'
          import subprocess, sys
          v='delivery/Physics9_Motion_Achilles_V4_PREVIEW_pql.mp4'
          d=float(sys.argv[1])
          for i,f in enumerate([.03,.07,.11,.15,.19,.23,.27,.31,.35,.39,.43,.47,.51,.55,.59,.63,.67,.71,.75,.79,.83,.87,.91,.95,.98],1):
              t=max(0,min(d-.05,d*f))
              subprocess.run(['ffmpeg','-y','-v','error','-ss',f'{t:.3f}','-i',v,'-frames:v','1',f'delivery/qa_preview/frame_{i:02d}.png'],check=True)
          PY
          ffmpeg -y -v error -pattern_type glob -i 'delivery/qa_preview/frame_*.png' -vf 'scale=420:-1,tile=5x5:padding=8:margin=8:color=white' -frames:v 1 delivery/PREVIEW_QA_CONTACT_SHEET.png

      - name: Preview hashes
        shell: bash
        run: |
          sha256sum delivery/Physics9_Motion_Achilles_V4_PREVIEW_pql.mp4 delivery/physics9_motion_achilles_v4_senior.py delivery/PREVIEW_QA_CONTACT_SHEET.png > delivery/SHA256_PREVIEW.txt

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: Physics9-Motion-Achilles-V4-Preview
          path: delivery/
          if-no-files-found: error
          retention-days: 7
