name: Render Statistics 10 Frequency Variance V4 PQH

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore corrected source and verify SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delivery
          echo "679e14377657f4a06f343dfa41b896150e6b687bb60998ccf9c16d0d34997543  source_chunks_frequency_v4/freq_v4_00" | sha256sum -c -
          echo "50ca744b52e67b72421fe278156b9d0975538ce2227f2f8ac11c28239e975c18  source_chunks_frequency_v4/freq_v4_01" | sha256sum -c -
          echo "a3d1ec4b1dfa1b96d000bf2d8597c2d252220ce6cab670c2ac174a7563150d0d  source_chunks_frequency_v4/freq_v4_02" | sha256sum -c -
          echo "ee13e55ede4b5f4ec4c66572d66dbae1e17dbd4e7230bb742f82b82ffecbb5f1  source_chunks_frequency_v4/freq_v4_03" | sha256sum -c -
          echo "d8d75e4ce7f3c626b3b318e1eecd9c03b3f1ec3219a0a02fb562768a66822e43  source_chunks_frequency_v4/freq_v4_04" | sha256sum -c -
          cat source_chunks_frequency_v4/freq_v4_* > statistics10_frequency_variance_source.gz.b64
          test "$(wc -c < statistics10_frequency_variance_source.gz.b64)" -eq 17584
          base64 -d statistics10_frequency_variance_source.gz.b64 | gzip -d \
            > statistics10_frequency_table_dispersion_variance_masterclass.py
          test -s statistics10_frequency_table_dispersion_variance_masterclass.py
          echo "f2ed2e9aff015fdb42ef2de5555108dcce5fee9e72628aa2a8b0531153d76e0f  statistics10_frequency_table_dispersion_variance_masterclass.py" | sha256sum -c -

      - name: Validate source and monochrome policy
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile statistics10_frequency_table_dispersion_variance_masterclass.py
          grep -q '^class Statistics10FrequencyTableVarianceMasterclass' statistics10_frequency_table_dispersion_variance_masterclass.py
          ! grep -En '(color|fill_color|stroke_color)[[:space:]]*=[[:space:]]*(BLUE|RED|GREEN|ORANGE|PURPLE|TEAL|YELLOW)' statistics10_frequency_table_dispersion_variance_masterclass.py

      - name: Pull ManimCE and install FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          docker pull manimcommunity/manim:v0.20.1
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Execute numerical assertions
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -v "$PWD:/manim" -w /manim \
            --entrypoint bash manimcommunity/manim:v0.20.1 \
            -c 'set -euo pipefail; python statistics10_frequency_table_dispersion_variance_masterclass.py'

      - name: Render full QA preview with literal -pql
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=0.10 \
            -v "$PWD:/manim" -w /manim \
            --entrypoint bash manimcommunity/manim:v0.20.1 \
            -c '
              set -euo pipefail
              mkdir -p /tmp/manim-home /tmp/manim-bin delivery
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH="/tmp/manim-bin:$PATH"
              manim -pql --fps 15 -r 854,480 --format=mp4 --disable_caching \
                --media_dir media_preview \
                statistics10_frequency_table_dispersion_variance_masterclass.py \
                Statistics10FrequencyTableVarianceMasterclass
              VIDEO=$(find media_preview -type f -name Statistics10FrequencyTableVarianceMasterclass.mp4 -print -quit)
              test -n "$VIDEO" && test -s "$VIDEO"
              cp "$VIDEO" delivery/Statistics10FrequencyTableVarianceMasterclass_pql_preview.mp4
            '
          ffprobe -v error \
            -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt \
            -show_entries format=duration,size -of default=noprint_wrappers=1 \
            delivery/Statistics10FrequencyTableVarianceMasterclass_pql_preview.mp4 \
            | tee delivery/PQL_FFPROBE.txt
          ffmpeg -v error -i delivery/Statistics10FrequencyTableVarianceMasterclass_pql_preview.mp4 -f null -

      - name: Render final classroom version with literal -pqh
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=1.00 \
            -v "$PWD:/manim" -w /manim \
            --entrypoint bash manimcommunity/manim:v0.20.1 \
            -c '
              set -euo pipefail
              mkdir -p /tmp/manim-home /tmp/manim-bin delivery
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH="/tmp/manim-bin:$PATH"
              manim -pqh --fps 30 -r 1920,1080 --format=mp4 --disable_caching \
                --media_dir media_final \
                statistics10_frequency_table_dispersion_variance_masterclass.py \
                Statistics10FrequencyTableVarianceMasterclass
              VIDEO=$(find media_final -type f -name Statistics10FrequencyTableVarianceMasterclass.mp4 -print -quit)
              test -n "$VIDEO" && test -s "$VIDEO"
              cp "$VIDEO" delivery/Statistics10FrequencyTableVarianceMasterclass_pqh.mp4
            '

      - name: Verify, inspect, and package final delivery
        shell: bash
        run: |
          set -euo pipefail
          VIDEO=delivery/Statistics10FrequencyTableVarianceMasterclass_pqh.mp4
          test -s "$VIDEO"
          cp statistics10_frequency_table_dispersion_variance_masterclass.py delivery/
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=codec_name,profile,width,height,r_frame_rate,avg_frame_rate,pix_fmt,nb_frames \
            -show_entries format=duration,size -of default=noprint_wrappers=1 \
            "$VIDEO" | tee delivery/FFPROBE.txt
          grep -qx 'codec_name=h264' delivery/FFPROBE.txt
          grep -qx 'width=1920' delivery/FFPROBE.txt
          grep -qx 'height=1080' delivery/FFPROBE.txt
          grep -qx 'r_frame_rate=30/1' delivery/FFPROBE.txt
          grep -qx 'pix_fmt=yuv420p' delivery/FFPROBE.txt
          ffmpeg -v error -i "$VIDEO" -f null -

          mkdir -p delivery/qa_frames
          DURATION=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$VIDEO")
          python - "$DURATION" <<'PY'
          import subprocess, sys
          duration = float(sys.argv[1])
          fractions = [0.02, 0.08, 0.15, 0.23, 0.31, 0.39, 0.47, 0.55, 0.63, 0.71, 0.80, 0.89, 0.96]
          for i, fraction in enumerate(fractions, 1):
              timestamp = max(0.0, min(duration - 0.2, duration * fraction))
              subprocess.run([
                  'ffmpeg', '-y', '-v', 'error', '-ss', f'{timestamp:.3f}',
                  '-i', 'delivery/Statistics10FrequencyTableVarianceMasterclass_pqh.mp4',
                  '-frames:v', '1', f'delivery/qa_frames/frame_{i:02d}.png'
              ], check=True)
          PY
          ffmpeg -y -v error -pattern_type glob -i 'delivery/qa_frames/frame_*.png' \
            -vf 'scale=640:-1,tile=3x5:padding=8:margin=8:color=white' \
            -frames:v 1 delivery/QA_CONTACT_SHEET.png
          cat > delivery/RENDER_INFO.txt <<'EOF'
          Scene: Statistics10FrequencyTableVarianceMasterclass
          Source: statistics10_frequency_table_dispersion_variance_masterclass.py
          ManimCE: 0.20.1
          Preview: manim -pql statistics10_frequency_table_dispersion_variance_masterclass.py Statistics10FrequencyTableVarianceMasterclass --format=mp4 --disable_caching
          Final: manim -pqh statistics10_frequency_table_dispersion_variance_masterclass.py Statistics10FrequencyTableVarianceMasterclass --format=mp4 --disable_caching
          Visual policy: black text/equations; neutral grayscale shapes.
          QA corrections: long titles dynamically fitted; mathematical headers typeset with MathTex.
          Dataset: 2, 2, 3, 4, 4, 4, 5, 6
          Mean: 3.75
          Population variance: 1.6875
          Population standard deviation: approximately 1.299
          EOF
          sha256sum \
            delivery/Statistics10FrequencyTableVarianceMasterclass_pqh.mp4 \
            delivery/Statistics10FrequencyTableVarianceMasterclass_pql_preview.mp4 \
            delivery/statistics10_frequency_table_dispersion_variance_masterclass.py \
            delivery/QA_CONTACT_SHEET.png > delivery/SHA256SUMS.txt

      - name: Upload complete artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Statistics10FrequencyTableVarianceMasterclass-pqh-v4
          path: delivery/
          if-no-files-found: error
          retention-days: 7
