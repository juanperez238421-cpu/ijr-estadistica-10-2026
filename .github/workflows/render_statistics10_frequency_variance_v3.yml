name: Render Statistics 10 Frequency Variance V3 PQH

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore exact source and verify SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delivery

          echo "b0310c197f9b96190e8622d783f499205abca6343d813596e4a63ce6c3b372a6  source_chunks_frequency_v3/freq_v1_00_part_00" | sha256sum -c -
          echo "c62ebcaa77eecdddb24903c2d94e2f395cf353373f4ffb5897b5dece0c02aad0  source_chunks_frequency_v3/freq_v1_00_part_01" | sha256sum -c -
          echo "140c7482797a2ed93d9c095d06d0884b0c45c888da1fed5f05becaba63c024a2  source_chunks_frequency_v3/freq_v1_01" | sha256sum -c -

          cat \
            source_chunks_frequency_v3/freq_v1_00_part_00 \
            source_chunks_frequency_v3/freq_v1_00_part_01 \
            source_chunks_frequency_v3/freq_v1_01 \
            > statistics10_frequency_variance_source.gz.b64

          test "$(wc -c < statistics10_frequency_variance_source.gz.b64)" -eq 17404
          base64 -d statistics10_frequency_variance_source.gz.b64 \
            | gzip -d \
            > statistics10_frequency_table_dispersion_variance_masterclass.py
          test -s statistics10_frequency_table_dispersion_variance_masterclass.py
          echo "99d79be50562260a140ac200812b6d6728f758146257136fa23e1cf3ba622d2c  statistics10_frequency_table_dispersion_variance_masterclass.py" \
            | sha256sum -c -

      - name: Validate Python syntax and monochrome text policy
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile statistics10_frequency_table_dispersion_variance_masterclass.py
          grep -q '^class Statistics10FrequencyTableVarianceMasterclass' \
            statistics10_frequency_table_dispersion_variance_masterclass.py
          ! grep -En 'BLUE|RED|GREEN|ORANGE|PURPLE|TEAL|YELLOW' \
            statistics10_frequency_table_dispersion_variance_masterclass.py

      - name: Pull official ManimCE image
        shell: bash
        run: |
          set -euo pipefail
          docker pull manimcommunity/manim:v0.20.1

      - name: Ensure host verification tools
        shell: bash
        run: |
          set -euo pipefail
          command -v ffmpeg
          command -v ffprobe

      - name: Execute numerical assertions
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -v "$PWD:/manim" \
            -w /manim \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c 'set -euo pipefail; python statistics10_frequency_table_dispersion_variance_masterclass.py'

      - name: Render complete QA preview with literal -pql
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=0.10 \
            -v "$PWD:/manim" \
            -w /manim \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c '
              set -euo pipefail
              mkdir -p /tmp/manim-home /tmp/manim-bin delivery
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH="/tmp/manim-bin:$PATH"
              manim -pql --fps 15 -r 854,480 \
                --format=mp4 --disable_caching \
                --media_dir media_preview \
                statistics10_frequency_table_dispersion_variance_masterclass.py \
                Statistics10FrequencyTableVarianceMasterclass
              VIDEO=$(find media_preview -type f \
                -name Statistics10FrequencyTableVarianceMasterclass.mp4 \
                -print -quit)
              test -n "$VIDEO"
              test -s "$VIDEO"
              cp "$VIDEO" delivery/Statistics10FrequencyTableVarianceMasterclass_pql_preview.mp4
            '

      - name: Inspect and fully decode QA preview
        shell: bash
        run: |
          set -euo pipefail
          ffprobe -v error \
            -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            delivery/Statistics10FrequencyTableVarianceMasterclass_pql_preview.mp4 \
            | tee delivery/PQL_FFPROBE.txt
          ffmpeg -v error \
            -i delivery/Statistics10FrequencyTableVarianceMasterclass_pql_preview.mp4 \
            -f null -

      - name: Render final classroom version with literal -pqh
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=1.00 \
            -v "$PWD:/manim" \
            -w /manim \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c '
              set -euo pipefail
              mkdir -p /tmp/manim-home /tmp/manim-bin delivery
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/manim-bin/xdg-open
              chmod +x /tmp/manim-bin/xdg-open
              export PATH="/tmp/manim-bin:$PATH"
              manim -pqh --fps 30 -r 1920,1080 \
                --format=mp4 --disable_caching \
                --media_dir media_final \
                statistics10_frequency_table_dispersion_variance_masterclass.py \
                Statistics10FrequencyTableVarianceMasterclass
              VIDEO=$(find media_final -type f \
                -name Statistics10FrequencyTableVarianceMasterclass.mp4 \
                -print -quit)
              test -n "$VIDEO"
              test -s "$VIDEO"
              cp "$VIDEO" delivery/Statistics10FrequencyTableVarianceMasterclass_pqh.mp4
            '

      - name: Verify final MP4, capture QA frames, and package
        shell: bash
        run: |
          set -euo pipefail
          VIDEO=delivery/Statistics10FrequencyTableVarianceMasterclass_pqh.mp4
          test -s "$VIDEO"
          cp statistics10_frequency_table_dispersion_variance_masterclass.py delivery/

          ffprobe -v error \
            -select_streams v:0 \
            -show_entries stream=codec_name,profile,width,height,r_frame_rate,avg_frame_rate,pix_fmt,nb_frames \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            "$VIDEO" | tee delivery/FFPROBE.txt

          grep -qx 'codec_name=h264' delivery/FFPROBE.txt
          grep -qx 'width=1920' delivery/FFPROBE.txt
          grep -qx 'height=1080' delivery/FFPROBE.txt
          grep -qx 'r_frame_rate=30/1' delivery/FFPROBE.txt
          grep -qx 'pix_fmt=yuv420p' delivery/FFPROBE.txt

          ffmpeg -v error -i "$VIDEO" -f null -

          mkdir -p delivery/qa_frames
          DURATION=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$VIDEO")
          python - "$DURATION" <<'PY'
          import subprocess
          import sys

          duration = float(sys.argv[1])
          fractions = [0.02, 0.08, 0.15, 0.23, 0.31, 0.39, 0.47, 0.55, 0.63, 0.71, 0.80, 0.89, 0.96]
          for index, fraction in enumerate(fractions, start=1):
              timestamp = max(0.0, min(duration - 0.2, duration * fraction))
              subprocess.run(
                  [
                      'ffmpeg', '-y', '-v', 'error',
                      '-ss', f'{timestamp:.3f}',
                      '-i', 'delivery/Statistics10FrequencyTableVarianceMasterclass_pqh.mp4',
                      '-frames:v', '1',
                      f'delivery/qa_frames/frame_{index:02d}.png',
                  ],
                  check=True,
              )
          PY

          ffmpeg -y -v error \
            -pattern_type glob -i 'delivery/qa_frames/frame_*.png' \
            -vf 'scale=640:-1,tile=3x5:padding=8:margin=8:color=white' \
            -frames:v 1 delivery/QA_CONTACT_SHEET.png

          cat > delivery/RENDER_INFO.txt <<'EOF'
          Scene: Statistics10FrequencyTableVarianceMasterclass
          Source: statistics10_frequency_table_dispersion_variance_masterclass.py
          ManimCE: 0.20.1
          Preview command: manim -pql statistics10_frequency_table_dispersion_variance_masterclass.py Statistics10FrequencyTableVarianceMasterclass --format=mp4 --disable_caching
          Final command: manim -pqh statistics10_frequency_table_dispersion_variance_masterclass.py Statistics10FrequencyTableVarianceMasterclass --format=mp4 --disable_caching
          Visual policy: all text and equations are black; fills and lines are monochrome.
          Dataset: 2, 2, 3, 4, 4, 4, 5, 6
          Population mean: 3.75
          Population variance: 1.6875
          Population standard deviation: approximately 1.299
          EOF

          sha256sum \
            delivery/Statistics10FrequencyTableVarianceMasterclass_pqh.mp4 \
            delivery/Statistics10FrequencyTableVarianceMasterclass_pql_preview.mp4 \
            delivery/statistics10_frequency_table_dispersion_variance_masterclass.py \
            delivery/QA_CONTACT_SHEET.png \
            > delivery/SHA256SUMS.txt

      - name: Upload complete artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Statistics10FrequencyTableVarianceMasterclass-pqh-v3
          path: delivery/
          if-no-files-found: error
          retention-days: 7
